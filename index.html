<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Balanced Screener - پنل تحلیل و سیگنال‌ها</title>

<style>
/* ═══════════════════════════════════════════════════════════════════
   استایل‌های داخلی (کاملاً منطبق با عکس‌های شما + المان اسکن)
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0b0d11;
  --card: #141820;
  --card2: #1b212c;
  --bd: #232830;
  --bd2: #2d3442;
  --tx: #e6e9ee;
  --tx2: #a7aebb;
  --mu: #7a828e;
  --gb: #46c58c;
  --gd: rgba(70, 197, 140, 0.12);
  --rb: #ff5c5c;
  --rd: rgba(255, 92, 92, 0.12);
  --rad: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, sans-serif;
  padding-bottom: 90px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Splash Screen */
#ai-splash {
  position: fixed; inset: 0; background: var(--bg); z-index: 10000;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
#ai-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

/* Header */
header.bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background: var(--card); border-bottom: 1px solid var(--bd); position: sticky; top: 0; z-index: 100;
}
.acts-right { display: flex; align-items: center; flex-shrink: 0; }
.ic-lang {
  background: var(--card2); border: 1px solid var(--bd); color: var(--tx);
  border-radius: 10px; width: 42px; height: 38px; display: grid; place-items: center; cursor: pointer; font-size: 14px; font-weight: 800;
}
.brand-center { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; color: var(--tx); }
.logo-icon {
  display: grid; place-items: center; width: 28px; height: 28px;
  background: var(--gb); color: #06150d; border-radius: 8px; font-size: 14px; box-shadow: 0 0 15px rgba(70, 197, 140, 0.4);
}
.acts-left { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.ic {
  background: var(--card2); border: 1px solid var(--bd); color: var(--tx);
  border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; position: relative;
}
.ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: -4px; inset-inline-end: -4px; background: var(--rb); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 99px; display: none; }
.badge.on { display: block; }

/* Controls */
.ctl { padding: 12px; }
.mode-switch { display: flex; gap: 6px; background: var(--card); padding: 4px; border: 1px solid var(--bd); border-radius: 12px; margin-bottom: 10px; }
.mode-switch button { flex: 1; min-height: 44px; background: transparent; border: none; color: var(--mu); font-weight: 600; border-radius: 9px; cursor: pointer; font-size: 14px; }
.mode-switch button.on { background: var(--card2); color: var(--tx); border: 1px solid var(--bd2); }

.strategy-box { background: var(--card); border: 1px solid var(--bd); border-radius: var(--rad); padding: 12px 16px; margin-bottom: 10px; }
.strategy-title { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; }
.od { display: inline-block; width: 10px; height: 10px; background: var(--gb); border-radius: 50%; margin-inline-end: 8px; }
.cond-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.c-chip { background: var(--card2); border: 1px solid var(--bd); color: var(--mu); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.c-chip.on { background: var(--gd); border-color: var(--gb); color: var(--gb); }

.nav { display: flex; gap: 10px; margin-bottom: 12px; }
.nav a { flex: 1; background: var(--card); border: 1px solid var(--bd); padding: 14px; border-radius: 12px; color: var(--tx); text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-bottom: 10px; }
.chips::-webkit-scrollbar { display: none; }
.mkt { flex: none; background: var(--card); border: 1px solid var(--bd); color: var(--tx2); padding: 8px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.mkt.on { border-color: var(--gb); color: var(--gb); background: var(--gd); }
.mkt .cnt { font-size: 10px; opacity: 0.7; direction: ltr; }

/* ═══════════════════════════════════════════════════════════════════
   المان زیبای اسکن بازار (Scan Status Card)
   ═══════════════════════════════════════════════════════════════════ */
#scanStatusCard {
  display: none;
  background: linear-gradient(135deg, rgba(70,197,140,0.08), rgba(20,24,32,1));
  border: 1px solid rgba(70,197,140,0.3);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(70,197,140,0.05);
}
#scanStatusCard.on { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.ss-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.ss-info { display: flex; flex-direction: column; gap: 4px; direction: ltr; text-align: left; }
.ss-counter { font-size: 16px; font-weight: 800; color: var(--tx); }
.ss-counter span { color: var(--gb); }
.ss-symbol { font-size: 13px; color: var(--tx2); font-weight: 600; }

/* رادار چرخان */
.ss-radar {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid rgba(70,197,140,0.4);
  position: relative;
  background: radial-gradient(circle, rgba(70,197,140,0.2) 0%, transparent 70%);
}
.ss-radar::before, .ss-radar::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(70,197,140,0.2);
}
.ss-radar::after { inset: 8px; }
.ss-sweep {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(70,197,140,0.8), transparent 60deg);
  animation: radarSpin 1.5s linear infinite;
}
@keyframes radarSpin { to { transform: rotate(360deg); } }

/* نوار پیشرفت */
.ss-progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; width: 100%; margin-top: 8px; direction: ltr; }
.ss-progress-fill { height: 100%; width: 0%; background: var(--gb); border-radius: 4px; transition: width 0.1s linear; }

/* Status Text */
.st { text-align:center; padding:10px 0; font-size:13px; color:var(--mu); font-weight: 500; margin-bottom: 10px; }

/* List & Cards */
#list { padding: 0 12px; display: flex; flex-direction: column; gap: 10px; }
.row.sig { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 14px; position: relative; overflow: hidden; }
.row.sig.LONG { border-inline-start: 4px solid var(--gb); }
.row.sig.SHORT { border-inline-start: 4px solid var(--rb); }
.r-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; direction: ltr; }
.r-badges { display: flex; align-items: center; }
.r-tags { display: flex; align-items: center; gap: 6px; margin-left: auto; margin-right: 8px; }
.sym { font-weight: 800; font-size: 16px; color: var(--tx); direction: ltr; }
.b { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.b.LONG { background: var(--gd); color: var(--gb); }
.b.SHORT { background: var(--rd); color: var(--rb); }
.tag { font-size: 10.5px; background: var(--card2); border: 1px solid var(--bd2); color: var(--tx2); padding: 3px 8px; border-radius: 6px; }

.r-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; }
.r-grid div { background: var(--bg); border: 1px solid var(--bd2); border-radius: 10px; padding: 10px; }
.r-grid i { color: var(--mu); display: block; font-style: normal; font-size: 10.5px; margin-bottom: 4px; text-align: right;}
.r-grid b { color: var(--tx); font-size: 14px; direction: ltr; display: block; text-align: left;}
.r-grid .neg { color: var(--rb); }
.r-grid .pos { color: var(--gb); }

.r-foot { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--mu); direction: rtl; }

/* Empty State (Moon) */
.empty { text-align:center; padding: 40px 20px; color:var(--mu); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-text { font-size: 14px; line-height: 1.8; }

/* No Signal Section (Accordion) */
details.nb { margin-top: 16px; }
details.nb summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 50px; padding: 0 16px; background: var(--card); border: 1px solid var(--bd2); border-radius: 12px; color: var(--tx2); font-size: 13.5px; font-weight: 600; }
details.nb summary::-webkit-details-marker { display: none; }
details.nb summary::after { content: "▼"; color: var(--mu); transition: transform .2s; font-size: 12px;}
details.nb[open] summary::after { transform: rotate(180deg); }

.row.none { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--bd2); border-radius: 12px; }
.rn-right { display: flex; flex-direction: column; gap: 4px; }
.rn-right .sym { font-weight: 800; font-size: 15px; color: var(--tx); direction: ltr; text-align: left; }
.rn-right .why { font-size: 12px; color: var(--mu); }
.rn-left { display: flex; align-items: center; gap: 12px; }
.rn-left .score { font-size: 14px; font-weight: 700; color: var(--tx2); direction: ltr; }
.ring-box { position: relative; width: 44px; height: 44px; display: grid; place-items: center; }
.ring-box svg { position: absolute; inset: 0; }
.ring-box .inner-pill { width: 10px; height: 22px; border-radius: 99px; z-index: 1; }

/* Error State Message */
.err-box { background: rgba(255, 92, 92, 0.1); border: 1px solid rgba(255, 92, 92, 0.3); border-radius: 12px; padding: 16px; color: var(--tx); text-align: center; margin-bottom: 10px; }
.err-box h4 { color: var(--rb); margin-bottom: 8px; }
.err-box p { font-size: 13px; line-height: 1.6; color: var(--tx2); margin-bottom: 10px; }
.err-list { font-size: 11px; color: var(--mu); direction: ltr; text-align: left; max-height: 100px; overflow-y: auto; background: var(--bg); padding: 8px; border-radius: 6px; }

/* Scan Button */
.scan-container { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 16px); left: 16px; right: 16px; z-index: 99; }
.big-scan { width: 100%; min-height: 54px; background: var(--gb); color: #0b0d11; border: none; border-radius: 14px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 20px rgba(70, 197, 140, 0.3); display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s;}
.big-scan:active { transform: scale(0.98); }
.big-scan.loading { background: var(--card2); color: var(--gb); border: 1px solid var(--gb); }
.scan-loader { display: inline-block; width: 20px; height: 4px; background: rgba(0,0,0,0.2); border-radius: 2px; position: relative; overflow: hidden; }
.scan-loader::after { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 50%; background: #0b0d11; border-radius: 2px; animation: load 1.5s infinite; }
@keyframes load { 0% { left: 0; width: 0; } 50% { width: 100%; } 100% { left: 100%; width: 0; } }

.sk { height:110px; background:var(--card); border-radius:14px; margin-bottom:10px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: .6; } 50% { opacity: 1; } 100% { opacity: .6; } }
</style>
</head>
<body>

<div id="ai-splash">
    <img src="https://raw.githubusercontent.com/massud2020/Balanced-Screener/main/ai-avatar.jpg" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:16px;box-shadow:0 0 24px rgba(70,197,140,.25)">
    <div style="font-size:20px;font-weight:800;margin-bottom:6px;color:var(--tx)">Balanced Screener</div>
    <div class="ai-text" id="ai-text" style="font-size:14px;color:var(--tx2);margin-bottom:20px;">برای ورود ضربه بزنید</div>
    <button id="start-ai-btn" class="big-scan" type="button" style="width:min(240px,80%);">ورود به اسکرینر</button>
    <button id="skip-ai-btn" type="button" style="margin-top:12px;background:transparent;border:none;color:var(--mu);padding:8px 16px;font-size:13px;text-decoration:underline;">رد کردن</button>
</div>

<header class="bar">
  <div class="acts-right"><button class="ic-lang" id="langToggle">EN</button></div>
  <div class="brand-center">
    <span>Balanced Screener</span>
    <div class="logo-icon">◈</div>
  </div>
  <div class="acts-left">
    <button class="ic" id="showHist">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      <span id="unreadBadge" class="badge">0</span>
    </button>
    <button class="ic" id="gs">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<section class="ctl">
  <div class="mode-switch">
    <button id="modePattern" class="on">الگوی ۳+۱ (روند)</button>
    <button id="modeRange">استراتژی رنج</button>
  </div>
  <div class="strategy-box">
    <div class="strategy-title">
      <span id="stratTitle">الگوی ۳+۱</span>
      <span class="od"></span>
    </div>
    <div class="cond-chips" id="condChips"></div>
  </div>
  <div class="nav">
    <a href="backtest.html"><span>📊</span><span>بک‌تست</span></a>
    <a href="alerts.html"><span>🔔</span><span>هشدار قیمت</span></a>
  </div>
  <div class="chips" id="mkts"></div>

  <!-- ═══ المان اسکن بازار ═══ -->
  <div id="scanStatusCard">
    <div class="ss-top">
      <div class="ss-info">
        <div class="ss-counter"><span id="scanCurrent">0</span> / <span id="scanTotal">0</span></div>
        <div class="ss-symbol" id="scanSymbol">-</div>
      </div>
      <div class="ss-radar"><div class="ss-sweep"></div></div>
    </div>
    <div class="ss-progress-track">
      <div class="ss-progress-fill" id="scanProgressFill"></div>
    </div>
  </div>
</section>

<div class="st" id="st">آماده</div>

<main id="list">
    <div class="sk"></div>
    <div class="sk"></div>
    <div class="sk"></div>
</main>

<div class="scan-container">
  <button class="big-scan" id="go">
    <span class="scan-loader"></span>
    <span id="goT">اسکن</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const $ = i => document.getElementById(i);
const LS = (k, v) => { try { if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } };
const setText = (id, text) => { const el = $(id); if(el) el.textContent = text; };
const fmtNum = n => Number(n).toLocaleString('fa-IR');

let currentMode = LS("bs_mode") || "pattern";
let currentLang = LS("bs_lang") || 'fa';
let UNREAD = parseInt(LS("bs_unread") || "0");
let isScanning = false; // متغیر جلوگیری از تداخل اسکن‌ها

function killSplash(){ var s=$('ai-splash'); if(s) s.style.display='none'; }
document.addEventListener('DOMContentLoaded', function(){
    if($('skip-ai-btn')) $('skip-ai-btn').onclick = () => { killSplash(); scan(true); };
    if($('start-ai-btn')) $('start-ai-btn').onclick = () => { killSplash(); scan(true); };
});

// Logic for UI
function applyLanguage() {
    document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
    setText("stratTitle", currentMode === "range" ? "استراتژی رنج" : "الگوی ۳+۱");
    setText("langToggle", currentLang === 'fa' ? "EN" : "FA");
}
if($("modePattern")) $("modePattern").onclick = () => { currentMode="pattern"; LS("bs_mode","pattern"); $("modePattern").classList.add("on"); $("modeRange").classList.remove("on"); applyLanguage(); };
if($("modeRange")) $("modeRange").onclick = () => { currentMode="range"; LS("bs_mode","range"); $("modeRange").classList.add("on"); $("modePattern").classList.remove("on"); applyLanguage(); };
if($("langToggle")) $("langToggle").onclick = () => { currentLang = currentLang==="fa"?"en":"fa"; LS("bs_lang", currentLang); applyLanguage(); };

function renderCondChips() {
    let labels = currentMode === "range" ? { rsi: "RSI", bb: "BB" } : { trend: "EMA200", emax: "EMA21/50", nc: "بدون تقاطع", pat: "۳+۱", m15: "M15", h1: "H1", rsi: "RSI" };
    $("condChips").innerHTML = Object.keys(labels).map(k => `<button class="c-chip on">${labels[k]}</button>`).join("");
}
renderCondChips();

// Mock Markets
const MKT_LABEL = {crypto:"کریپتو",forex:"فارکس",metal:"فلزات",commodity:"کالا",index:"شاخص",stock:"سهام"};
const MKT_COUNTS = {crypto:12, forex:28, metal:3, commodity:7, index:11, stock:14};

function renderChips() {
    $("mkts").innerHTML = Object.keys(MKT_LABEL).map(m => {
        return `<button class="mkt on" data-m="${m}">${MKT_LABEL[m]} <span class="cnt">${MKT_COUNTS[m]}/${MKT_COUNTS[m]}</span></button>`;
    }).join("");
}
renderChips();

// Logic for Scanning
async function fetchGitJson(filename) {
    const branches = ['main', 'master'];
    for (let branch of branches) {
        try {
            const url = `https://raw.githubusercontent.com/massud2020/Balanced-Screener/${branch}/${filename}?t=${Date.now()}`;
            const res = await fetch(url, { cache: 'no-store' });
            if (res.ok) return await res.json();
        } catch(e) {}
    }
    throw new Error("Fetch error");
}

async function scan(isAuto = false) {
    if (isScanning) return; // اگر در حال اسکن است، دوباره شروع نکن
    isScanning = true;

    const btn = $("go");
    const statusCard = $("scanStatusCard");
    const counter = $("scanCurrent");
    const totalEl = $("scanTotal");
    const symEl = $("scanSymbol");
    const progressFill = $("scanProgressFill");
    const stEl = $("st");

    // فعال کردن ظاهر اسکن (چه دستی چه خودکار)
    if(!isAuto) {
        btn.classList.add("loading");
        $("goT").textContent = "در حال اسکن...";
    }
    statusCard.classList.add("on");

    try {
        stEl.textContent = "در حال دریافت دیتا از سرور...";
        const json = await fetchGitJson('data.json');
        const rows = json.rows || [];
        
        totalEl.textContent = rows.length;
        
        // شبیه‌سازی انیمیشن اسکن (حتی در حالت خودکار، برای اینکه کاربر ببیند سیستم کار می‌کند)
        for(let i=0; i<rows.length; i++) {
            const r = rows[i];
            counter.textContent = i + 1;
            symEl.textContent = r.id;
            progressFill.style.width = `${((i+1)/rows.length)*100}%`;
            
            // در اسکن خودکار سریع‌تر رد شو تا کاربر معطل نشود
            const delay = isAuto ? 5 : 15; 
            if(i % 3 === 0) await new Promise(res => setTimeout(res, delay));
        }

        renderList(rows);
        stEl.innerHTML = `آخرین اسکن سرور: ${new Date(json.time).toLocaleTimeString('fa-IR')} · ${rows.length} نماد`;
        
    } catch (e) {
        stEl.textContent = "خطا در دریافت دیتا از سرور";
        $("list").innerHTML = `
        <div class="err-box">
            <h4>⚠️ خطا در دریافت دیتا</h4>
            <p>ممکن است دسترسی به سرور محدود شده باشد. لطفاً از VPN یا توکن OANDA استفاده کنید.</p>
            <div class="err-list">BTCUSDT, ETHUSDT, XRPUSDT, SOLUSDT, BNBUSDT...</div>
        </div>`;
    } finally {
        isScanning = false;
        if(!isAuto) {
            btn.classList.remove("loading");
            $("goT").textContent = "اسکن";
        }
        // مخفی کردن کارت اسکن بعد از یک ثانیه
        setTimeout(() => {
            statusCard.classList.remove("on");
            progressFill.style.width = "0%"; // ریست کردن نوار
        }, 1000);
    }
}

// Render List
function renderList(rows) {
    const sg = rows.filter(r => r.side).slice(0, 5); // فقط ۵ تا برای دمو
    let no = rows.filter(r => !r.side);

    let emptyHtml = '';
    if (sg.length === 0) {
        emptyHtml = `<div class="empty">
            <div class="empty-icon">🌙</div>
            <div class="empty-text">فعلاً سیگنالی نیست<br>اسکن خودکار ادامه دارد</div>
        </div>`;
    }

    let detailsHtml = '';
    if (no.length > 0) {
        const dummyNo = no.slice(0, 5).map((r, i) => ({ ...r, pass: 7-i, total: 7 }));
        detailsHtml = `
        <details class="nb" style="margin-top:16px;">
            <summary>
                <span>بدون سیگنال</span>
                <span>${fmtNum(no.length)} نماد</span>
            </summary>
            <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
                ${dummyNo.map(r => noneHtml(r)).join("")}
            </div>
        </details>`;
    }

    $("list").innerHTML = (sg.length ? sg.map(r => {
        const L = r.side === "LONG";
        return `<article class="row sig ${r.side}">
            <div class="r-head">
                <div class="r-badges"><span class="b ${r.side}">${L?"▲":"▼"} ${L?"لانگ":"شورت"}</span></div>
                <div class="r-tags"><span class="tag">${currentMode === 'range' ? 'رنج' : 'روند'}</span><span class="tag">کریپتو</span></div>
                <div class="sym">${r.id}</div>
            </div>
            <div class="r-grid">
                <div><i>ورود</i><b>${r.entry || '10.8540'}</b></div>
                <div><i>SL</i><b class="neg">${r.sl || '10.9103'}</b></div>
                <div><i>خروج</i><b class="pos">RSI</b></div>
            </div>
            <div class="r-foot">
                <span>ریسک <bdi>0.52%</bdi></span>
                <span><bdi dir="ltr">RSI 64</bdi></span>
            </div>
        </article>`;
    }).join("") : emptyHtml) + detailsHtml;
}

function noneHtml(r){
    let color = 'rgba(255,255,255,0.1)';
    let textColor = 'var(--tx2)';
    let N = r.total || 7;
    let P = r.pass || 0;
    
    if (N === 0) {
        color = 'rgba(255,255,255,0.1)'; textColor = 'var(--tx2)';
    } else {
        const ratio = P / N;
        if (P === N) {
            color = 'hsl(145, 80%, 55%)'; textColor = 'hsl(145, 80%, 65%)';
        } else {
            const hue = ratio * 120;
            color = `hsl(${hue}, 85%, 55%)`;
            textColor = `hsl(${hue}, 85%, 65%)`;
        }
    }
    
    const R = 15, cx = 22, cy = 22;
    let paths = '';
    if (N > 0) {
        const anglePerSeg = 360 / N;
        const gapAngle = Math.min(16, anglePerSeg * 0.4);
        const arcAngle = anglePerSeg - gapAngle;
        for (let i = 0; i < N; i++) {
            const startAngle = i * anglePerSeg - 90 + (gapAngle/2);
            const endAngle = startAngle + arcAngle;
            const x1 = cx + R * Math.cos(startAngle * Math.PI / 180);
            const y1 = cy + R * Math.sin(startAngle * Math.PI / 180);
            const x2 = cx + R * Math.cos(endAngle * Math.PI / 180);
            const y2 = cy + R * Math.sin(endAngle * Math.PI / 180);
            const isPassed = i < P;
            const strokeColor = isPassed ? color : 'rgba(255,255,255,0.1)';
            const largeArcFlag = arcAngle > 180 ? 1 : 0;
            paths += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${largeArcFlag} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round"/>`;
        }
    }
    return `
    <div class="row none">
        <div class="rn-right">
            <span class="sym">${r.id}</span>
            <span class="why">${currentMode === 'range' ? 'استراتژی رنج' : 'الگوی ۳+۱'}</span>
        </div>
        <div class="rn-left">
            <span class="score" style="color:${textColor}">${P}/${N}</span>
            <div class="ring-box">
                <svg width="44" height="44" viewBox="0 0 44 44">${paths}</svg>
                <div class="inner-pill" style="background:${P > 0 ? color : 'rgba(255,255,255,0.1)'}"></div>
            </div>
        </div>
    </div>`;
}

if($("go")) $("go").onclick = () => scan(false);

applyLanguage();

// اجرای اولیه پس از بسته شدن اسپلش
setTimeout(() => {
    scan(true); 
}, 1000);

// حلقه اسکن خودکار
setInterval(() => {
    // اگر اسپلش باز است، اسکن نکن
    if($('ai-splash').style.display !== 'none') return;
    
    // اجرای اسکن خودکار (isAuto = true)
    scan(true);
}, 3 * 60 * 1000); // 3 دقیقه

</script>
