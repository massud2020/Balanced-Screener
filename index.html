<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Balanced Screener</title>
<style>
:root{--bg:#0b0d11;--card:#12151b;--card2:#171b22;--bd:#232830;--bd2:#1b1f27;--tx:#e6e9ee;--tx2:#a7aebb;--mu:#78808d;--g:#2e9a69;--gb:#46c58c;--gd:rgba(47,157,104,.14);--r:#d4524c;--rb:#e8736d;--rd:rgba(209,75,69,.14);--rad:16px;--rs:12px;--font:"Segoe UI",system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);min-height:100dvh;padding:0 14px env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;transition:padding .2s}
bdi{unicode-bidi:isolate}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:var(--rs);padding:0 14px;min-height:44px;font:inherit;font-size:14px;cursor:pointer;-webkit-appearance:none;appearance:none;transition:background .15s,border-color .15s,transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:default;transform:none}
button:focus-visible,select:focus-visible,.row:focus-visible,a:focus-visible{outline:2px solid var(--gb);outline-offset:2px}

#ai-splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity 0.6s ease, visibility 0.6s ease}
#ai-splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.ai-avatar-img {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gb);
    box-shadow: 0 0 30px rgba(70,197,140,.6);
    margin-bottom: 30px;
    animation: pulse 2s infinite;
