<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Balanced Screener - پنل تحلیل و سیگنال‌ها</title>

<!-- کتابخانه Chart.js برای رسم نمودارهای مقایسه‌ای -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════
   استایل‌های داخلی (اصلاح شده برای موبایل و جلوگیری از بهم ریختگی)
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0b0d11;
  --card: #141820;
  --card2: #1b212c;
  --bd: #232830;
  --bd2: #2d3442;
  --tx: #e6e9ee;
  --tx2: #a7aebb;
  --mu: #7a828e;
  --gb: #46c58c;
  --gd: rgba(70, 197, 140, 0.15);
  --rb: #ff5c5c;
  --rd: rgba(255, 92, 92, 0.15);
  --rad: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, sans-serif;
  padding-bottom: 90px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Splash Screen */
#ai-splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
#ai-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

/* Header & Capsule Bar */
header.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background: var(--card);
  border-bottom: 1px solid var(--bd);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 10px;
}

/* اصلاح چیدمان وسط و جلوگیری از بیرون زدن دکمه‌ها */
.brand-badge-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-width: 0; /* بسیار مهم برای جلوگیری از بهم ریختگی */
  text-align: center;
}
.brand-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 15px;
  color: var(--tx);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-pill i { color: var(--gb); font-style: normal; }
.acts { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.ic {
  background: var(--card2);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  position: relative;
}
/* اصلاح آیکون‌ها برای اینکه توپر و لکه نشوند */
.ic svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.badge {
  position: absolute;
  top: -4px;
  inset-inline-end: -4px;
  background: var(--rb);
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 99px;
  display: none;
}
.badge.on { display: block; }

/* Control Panel & Chips */
.ctl { padding: 12px; }
.mode-switch {
  display: flex;
  gap: 6px;
  background: var(--card);
  padding: 4px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  margin-bottom: 10px;
}
.mode-switch button {
  flex: 1;
  min-height: 38px;
  background: transparent;
  border: none;
  color: var(--mu);
  font-weight: 600;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
}
.mode-switch button.on {
  background: var(--card2);
  color: var(--tx);
  border: 1px solid var(--bd2);
}

.strategy-box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--rad);
  padding: 12px;
  margin-bottom: 10px;
}
.strategy-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13.5px;
}
.od {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--gb);
  border-radius: 50%;
  margin-inline-end: 6px;
}
.cond-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.c-chip {
  background: var(--card2);
  border: 1px solid var(--bd);
  color: var(--mu);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.c-chip.on {
  background: var(--gd);
  border-color: var(--gb);
  color: var(--gb);
}

.nav { display: flex; gap: 8px; margin-bottom: 10px; }
.nav a {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--bd);
  padding: 10px;
  border-radius: 12px;
  color: var(--tx);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* Market Chips */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.mkt {
  flex: none;
  background: var(--card);
  border: 1px solid var(--bd);
  color: var(--tx2);
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mkt.on { border-color: var(--gb); color: var(--gb); background: var(--gd); }
.mkt .cnt { font-size: 10px; opacity: 0.7; direction: ltr; }

/* Rows & Signals */
#list { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
.row.sig {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 12px;
}
.row.sig.LONG { border-inline-start: 4px solid var(--gb); }
.row.sig.SHORT { border-inline-start: 4px solid var(--rb); }

.r-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sym { font-weight: 700; font-size: 15px; color: var(--tx); direction: ltr;}
.b { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.b.LONG { background: var(--gd); color: var(--gb); }
.b.SHORT { background: var(--rd); color: var(--rb); }

.r-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: var(--bg);
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}
.r-grid i { color: var(--mu); display: block; font-style: normal; font-size: 10.5px; margin-bottom: 2px;}
.r-grid b { color: var(--tx); font-size: 13px; direction: ltr; display: block;}
.r-grid .neg { color: var(--rb); }
.r-grid .pos { color: var(--gb); }

.r-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 12px;
  color: var(--mu);
}

/* Big Scan Button */
.scan-container {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 16px);
  left: 16px;
  right: 16px;
  z-index: 99;
}
.big-scan {
  width: 100%;
  min-height: 50px;
  background: var(--gb);
  color: #0b0d11;
  border: none;
  border-radius: 14px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(70, 197, 140, 0.3);
}

.set { display: none; padding: 12px; background: var(--card); border-top: 1px solid var(--bd); margin-top: 15px; border-radius: var(--rad); margin-bottom: 80px;}
.set h3 { font-size: 14px; color: var(--gb); margin: 12px 0 8px 0; }
.set label { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--bd); font-size: 13px; color: var(--tx2); }
</style>
</head>
<body>

<!-- ══════════════ SPLASH SCREEN ══════════════ -->
<div id="ai-splash">
    <div id="splashLangBar" style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);inset-inline-end:14px;z-index:10001;display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px">
      <button type="button" id="splashLangFa" data-lang="fa" style="min-width:48px;min-height:34px;border:none;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--mu)">FA</button>
      <button type="button" id="splashLangEn" data-lang="en" style="min-width:48px;min-height:34px;border:none;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--mu)">EN</button>
    </div>
    <img src="https://raw.githubusercontent.com/massud2020/Balanced-Screener/main/ai-avatar.jpg" class="ai-avatar-img" alt="AI Assistant" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:16px;box-shadow:0 0 24px rgba(70,197,140,.25)">
    <div style="font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;background:linear-gradient(90deg,#46c58c,#e6e9ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Balanced Screener</div>
    <div class="ai-text" id="ai-text" style="min-height:28px;font-size:14px;color:var(--tx2);font-weight:500">برای ورود و انتخاب رژیم بازار ضربه بزنید</div>
    <button id="start-ai-btn" class="big-scan" type="button" style="margin-top:22px;width:min(240px,80%);z-index:10001;position:relative;pointer-events:auto">ورود به اسکرینر</button>
    <button id="skip-ai-btn" type="button" style="margin-top:12px;background:transparent;border:none;color:var(--mu);padding:8px 16px;font-size:13px;z-index:10001;position:relative;pointer-events:auto;text-decoration:underline;text-underline-offset:3px">رد کردن</button>
    <div id="debug-err" style="color:var(--rb);font-size:11px;position:absolute;bottom:10px;direction:ltr;z-index:99999;text-align:center;width:100%;padding:0 10px;word-break:break-all"></div>
</div>

<!-- ══════════════ HEADER ══════════════ -->
<header class="bar">
  <div class="acts left">
    <button class="ic" id="langToggle" aria-label="Language">EN</button>
  </div>
  
  <div class="brand-badge-wrapper">
    <div class="brand-pill">
      <i>◈</i> <span>Balanced Screener</span>
    </div>
    <small id="ver" style="font-size:10px; color:var(--mu); margin-top:2px;">v87</small>
  </div>
  
  <div class="acts right">
    <button class="ic" id="showHist" aria-label="History">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      <span id="unreadBadge" class="badge">0</span>
    </button>
    <button class="ic" id="gs" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<!-- ══════════════ CONTROLS ══════════════ -->
<section class="ctl">
  <div class="mode-switch">
    <button id="modePattern" class="on">الگوی ۳+۱ (روند)</button>
    <button id="modeRange">استراتژی رنج</button>
  </div>

  <div class="strategy-box" aria-label="Strategy">
    <div class="strategy-title">
      <div><span class="od"></span><b id="stratTitle">الگوی ۳+۱</b></div>
    </div>
    <div class="cond-chips" id="condChips"></div>
  </div>

  <div class="nav"><a href="alerts.html"><span>🔔</span><span id="navAlerts">هشدار قیمت</span></a><a href="backtest.html"><span>📊</span><span id="navBacktest">بک‌تست</span></a></div>
  <div class="chips" id="mkts" aria-label="Markets"></div>
</section>

<!-- ══════════════ SETTINGS ══════════════ -->
<div class="set" id="set">
  <h3 id="setFilters">تنظیمات پیشرفته</h3>
  <label><span id="setH1Strict">H1 سخت‌گیرانه</span><input type="checkbox" id="h1s"></label>
  <div style="display:flex; gap:10px; margin-top:5px; margin-bottom:10px; padding: 0 14px;">
    <div style="flex:1; display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--mu);">
      <span id="setRsiL">خرید زیر:</span>
      <input type="number" id="rsiL" value="40" min="1" max="99" style="width:55px; min-height:30px; background:var(--bg); border:1px solid var(--bd); border-radius:6px; color:var(--tx); text-align:center; direction:ltr;">
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--mu);">
      <span id="setRsiS">فروش بالای:</span>
      <input type="number" id="rsiS" value="60" min="1" max="99" style="width:55px; min-height:30px; background:var(--bg); border:1px solid var(--bd); border-radius:6px; color:var(--tx); text-align:center; direction:ltr;">
    </div>
  </div>
  <label><span id="setOnly">فقط سیگنال‌دارها</span><input type="checkbox" id="only"></label>
  
  <h3 id="setSource">منبع داده</h3>
  <label><span id="setOanda">OANDA توکن</span><div style="display:flex;gap:6px;width:54%;align-items:center"><input type="password" id="tok" placeholder="API token" autocomplete="off" style="width:100%;min-height:38px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:0 11px;direction:ltr;font-size:13px"><button id="saveTok" style="min-height:38px;padding:0 12px;border-radius:10px;font-size:12px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);cursor:pointer">ذخیره</button></div></label>
  <label><span id="setExtraStocks">سهام اضافه<small>تیکرها با کاما</small></span><input id="ex" placeholder="مثلاً SHOP, UBER" autocomplete="off"></label>
  
  <h3 id="setApp">برنامه</h3>
  <label><span id="setClearCacheLabel">پاک‌کردن کش و به‌روزرسانی</span>
    <button type="button" id="upd" onclick="window.clearCache()" style="background:var(--gd);color:var(--gb);border:1px solid var(--gb);min-width:120px;font-weight:700; border-radius:8px; padding:6px;">پاک‌کردن کش</button>
  </label>

  <h3 id="setNotifs">اعلان‌ها و صدا</h3>
  <label><span id="setNotifSys">اعلان سیستمی و صدا</span><button id="nt" style="border-radius:8px; padding:6px;">فعال‌سازی</button></label>
  <label><span id="setNotifVoice">تست صدای هوش مصنوعی</span><button id="testVoiceBtn" onclick="window.testVoice()" style="background:var(--gd);color:var(--gb);border:1px solid var(--gb); border-radius:8px; padding:6px;">تست صدا</button></label>
  <label><span>سرعت صدا: <b id="ttsRateVal">35</b></span><input type="range" id="ttsRate" min="0" max="100" step="5" value="35" style="width:55%"></label>
</div>

<!-- ══════════════ LIST & LOADING ══════════════ -->
<div class="st" id="st" style="text-align:center; padding:10px; font-size:12px; color:var(--mu);">آماده</div>

<main id="list">
    <div class="sk" style="height:96px; background:var(--card); border-radius:12px;"></div>
    <div class="sk" style="height:96px; background:var(--card); border-radius:12px; margin-top:10px;"></div>
</main>

<!-- ══════════════ SCAN BUTTON ══════════════ -->
<div class="scan-container">
  <button class="big-scan" id="go">
    <span id="goT">اسکن</span> <small id="goC" style="font-size:12px; opacity:0.8; margin-right:6px;"></small>
  </button>
</div>

<!-- ══════════════ HISTORY MODAL ══════════════ -->
<div id="histModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; padding:20px; overflow:auto;">
  <div style="max-width:650px; margin:0 auto; background:var(--card); border:1px solid var(--bd); border-radius:var(--rad); padding:15px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 id="histTitle" style="color:var(--gb); margin:0; font-size:16px;">📊 پنل تحلیل و سیگنال‌ها</h3>
      <button id="closeHist" style="min-height:32px; padding:0 12px; background:var(--card2); border:1px solid var(--bd); color:var(--tx); border-radius:8px; cursor:pointer;">✕ بستن</button>
    </div>
    
    <div class="screener-history-panel">
        <div class="pnl-summary-card" style="display:flex; justify-content:space-between; background:var(--bg); padding:12px; border-radius:12px; border:1px solid var(--bd);">
            <div style="text-align:center; flex:1;">
                <span style="font-size:11px; color:var(--mu); display:block; margin-bottom:4px;">سود/زیان</span>
                <span id="totalNetPoints" style="font-size:15px; font-weight:800; color:var(--gb); direction:ltr; display:block;">۰</span>
            </div>
            <div style="text-align:center; flex:1; border-right:1px solid var(--bd); border-left:1px solid var(--bd);">
                <span style="font-size:11px; color:var(--mu); display:block; margin-bottom:4px;">برنده / بازنده</span>
                <span id="winLossCounts" style="font-size:15px; font-weight:700; display:block;">۰ / ۰</span>
            </div>
            <div style="text-align:center; flex:1;">
                <span style="font-size:11px; color:var(--mu); display:block; margin-bottom:4px;">وین‌ریت</span>
                <span id="totalWinRate" style="font-size:15px; font-weight:800; display:block;">۰٪</span>
            </div>
        </div>

        <div class="time-filter-container" style="display:flex; gap:6px; margin:12px 0;">
            <button class="filter-time-btn active" onclick="setTimeFilter('all', this)" style="flex:1; padding:6px; border-radius:8px; background:var(--card2); border:1px solid var(--bd); color:var(--tx); cursor:pointer; font-size:12px;">کل زمان‌ها</button>
            <button class="filter-time-btn" onclick="setTimeFilter('today', this)" style="flex:1; padding:6px; border-radius:8px; background:var(--card2); border:1px solid var(--bd); color:var(--tx); cursor:pointer; font-size:12px;">امروز</button>
            <button class="filter-time-btn" onclick="setTimeFilter('week', this)" style="flex:1; padding:6px; border-radius:8px; background:var(--card2); border:1px solid var(--bd); color:var(--tx); cursor:pointer; font-size:12px;">۷ روز اخیر</button>
        </div>

        <div class="chart-section" style="margin:15px 0; height:200px;">
            <h3 style="font-size:13px; margin-bottom:8px; color:var(--tx2);">📊 مقایسه عملکرد استراتژی‌ها</h3>
            <canvas id="strategyPerformanceChart"></canvas>
        </div>

        <div class="history-tabs" style="display:flex; gap:6px; margin-bottom:12px;">
            <button class="tab-btn active" onclick="switchHistoryTab('open', this)" id="btnOpen" style="flex:1; padding:8px; border-radius:8px; background:var(--card2); border:1px solid var(--bd); color:var(--tx); cursor:pointer; font-size:13px;">سیگنال‌های باز (<span id="openCount">0</span>)</button>
            <button class="tab-btn" onclick="switchHistoryTab('closed', this)" id="btnClosed" style="flex:1; padding:8px; border-radius:8px; background:var(--card2); border:1px solid var(--bd); color:var(--tx); cursor:pointer; font-size:13px;">سیگنال‌های بسته (<span id="closedCount">0</span>)</button>
        </div>

        <div id="signalsContainer" class="signals-container" style="display:flex; flex-direction:column; gap:8px; max-height:250px; overflow-y:auto;"></div>
    </div>
  </div>
</div>

window.__BS_LOCAL_BUILD = 87;

const LS = (k, v) => { try { if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } };
const setText = (id, text) => { const el = $(id); if(el) el.textContent = text; };

const I18N = {

let currentLang = LS("bs_lang") || 'fa';
const T = () => (I18N[currentLang] || I18N.fa);

let COND = {trend:true, emax:true, nc:true, pat:true, adx:false, m15:true, h1:true, rsi:true};
try { const savedCond = LS("bs_cond"); if (savedCond) COND = { ...COND, ...JSON.parse(savedCond) }; } catch(e) {}
COND.adx = false;

let currentMode = LS("bs_mode") || "pattern";
let ACTIVE_SIGS = {}; try { ACTIVE_SIGS = JSON.parse(LS("bs_active_sigs") || "{}"); } catch(e) {}
function saveActiveSigs(){ try{ LS("bs_active_sigs", JSON.stringify(ACTIVE_SIGS)); }catch(e){} }

let COOLDOWNS = {}; try { COOLDOWNS = JSON.parse(LS("bs_cooldowns") || "{}"); } catch(e) { COOLDOWNS = {}; }
function saveCooldowns() { try { LS("bs_cooldowns", JSON.stringify(COOLDOWNS)); } catch(e) {} }
const COOLDOWN_DURATION_MS = 30 * 60 * 1000;

let UNREAD = parseInt(LS("bs_unread") || "0");

/* ══════════════ TTS & SPLASH LOGIC (اصلاح شده) ══════════════ */
async function speakAI(text) {
  if (!text || LS("bs_tts_off") === "1") return;
  const raw = String(text).trim();
  if (!raw) return;

  return new Promise(function(resolve) {
      let finished = false;
      const finish = () => { if(finished) return; finished = true; resolve(); };
      setTimeout(finish, 4000); // تایمر اضطراری

      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          
          const utterance = new SpeechSynthesisUtterance(raw);
          // استفاده از زبان اصلی برنامه (فارسی یا انگلیسی) بدون ترجمه کلمات
          utterance.lang = currentLang === "fa" ? "fa-IR" : "en-US";
          utterance.rate = (+$("ttsRate")?.value || 35) / 50;
          
          utterance.onend = finish;
          utterance.onerror = finish;
          
          window.speechSynthesis.speak(utterance);
        } else { finish(); }
      } catch (e) { finish(); }
  });
}

window.testVoice = async () => { 
  await speakAI(currentLang === "fa" ? "تست صدا موفقیت آمیز بود" : "AI voice test successful."); 
};

function killSplash(){
  try{
    var s=document.getElementById('ai-splash');
    if(s){ s.classList.add('hidden'); setTimeout(()=>{s.style.display='none';}, 300); }
  }catch(e){}
}
window.hideSplash = function(){ killSplash(); };

window.__startAppFull = async function () {
    var fa = currentLang !== "en";
    var lines = fa ? ["خوش آمدید.","در حال آماده‌سازی..."] : ["Welcome.","Getting ready..."];
    
    var el = document.getElementById("ai-text");
    if (el) el.textContent = "در حال اتصال...";

    for(var i=0; i<lines.length; i++){
        if (el) el.textContent = lines[i];
        await speakAI(lines[i]);
    }
    
    killSplash();
    try { if (typeof scan === "function") scan(true); } catch (e) {}
};

window.startApp = function(){
    if (window.__startAppFull) { window.__startAppFull(); }
    else { killSplash(); }
};

document.addEventListener('DOMContentLoaded', function(){
    var sk=document.getElementById('skip-ai-btn');
    var st=document.getElementById('start-ai-btn');
    if(sk) sk.onclick = function(ev){ if(ev) ev.preventDefault(); window.hideSplash(); return false; };

});

window.clearCache = async () => {
    try {
        if ("serviceWorker" in navigator) {
            const rs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(rs.map(g => g.unregister()));
        }
        if (typeof caches !== "undefined") {
            const ks = await caches.keys();
            await Promise.all(ks.map(k => caches.delete(k)));
        }
    } catch (e) {}
    location.replace(location.pathname + "?r=" + Date.now());
};

function updateSplashLangUi() {
  const fa = currentLang === "fa";
  const btnFa = $("splashLangFa"), btnEn = $("splashLangEn");
  const on = "var(--gd)", onTx = "var(--gb)", off = "transparent", offTx = "var(--mu)";
  if (btnFa) { btnFa.style.background = fa ? on : off; btnFa.style.color = fa ? onTx : offTx; }
  if (btnEn) { btnEn.style.background = !fa ? on : off; btnEn.style.color = !fa ? onTx : offTx; }
  if ($("ai-text") && !$("ai-text").textContent.includes("اتصال")) {

  if ($("skip-ai-btn")) $("skip-ai-btn").textContent = fa ? "رد کردن" : "Skip";

  document.documentElement.lang = currentLang;
}

function renderCondChips() {

const BUILD=87;
async function fetchGitJson(filename) {
    const url = `https://raw.githubusercontent.com/massud2020/Balanced-Screener/main/${filename}?t=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
}

let D={}, LAST=null, vf="all";

async function scan(isAISilent = false) {
  try {
    const json = await fetchGitJson('data.json');
    const rows = json.rows || [];
    D = {}; 
    rows.forEach(r => {
        if (Array.isArray(r.a) && Array.isArray(r.h)) {
            D[r.id] = { id: r.id, a: r.a.map(c => ({time: c[0], open: c[1], high: c[2], low: c[3], close: c[4]})), h: r.h.map(c => ({time: c[0], open: c[1], high: c[2], low: c[3], close: c[4]})) }; 
        }
    });
    LAST = { rows: rows, errs: [], time: new Date(json.time) };
    renderList();
    if($("st")) $("st").innerHTML = `آخرین اسکن: ${new Date(json.time).toLocaleTimeString('fa-IR')}`;
  } catch (e) {
    if($("st")) $("st").textContent = T().errFetch;
  }
}

/* ══════════════ EVALUATION & COOLDOWN (اصلاح منطقی) ══════════════ */
function evalRow(r) {
    if (!D[r.id] || !D[r.id].a || !D[r.id].h) return r;
    try {
        const now = Date.now();
        
        // اگر در کول‌داون است، فقط رد شو (نباید کول‌داون رو تمدید کنه)
        if (COOLDOWNS[r.id] && (now - COOLDOWNS[r.id] < COOLDOWN_DURATION_MS)) {
            const remainingMins = Math.ceil((COOLDOWN_DURATION_MS - (now - COOLDOWNS[r.id])) / 60000);
            return { ...r, side: null, pass: 0, total: 7, fail: `کول‌داون (${remainingMins} دقیقه)`, checks: [] };
        }

        const opts = {
            mode: currentMode, trend: COND.trend, emax: COND.emax, nc: COND.nc, pat: COND.pat,
            adx: false, m15: COND.m15, h1: COND.h1, h1Strict: $("h1s") ? $("h1s").checked : false,
            rsi: COND.rsi, rsiL: +$("rsiL").value || 40, rsiS: +$("rsiS").value || 60
        };
        const res = evaluate(r.id, D[r.id].a, D[r.id].h, opts, now / 1000);
        let finalSide = res.side, finalFail = res.fail;

        // اگر سیگنال جدیدی صادر شد
        if (finalSide) {
            if (isSignalOpen(r.id)) {
                finalSide = null; finalFail = "سیگنال باز قبلی هنوز بسته نشده";
            } else {
                // فقط زمانی که سیگنال صادر می‌شود کول‌داون ست شود
                COOLDOWNS[r.id] = now;
                saveCooldowns();
                ACTIVE_SIGS[r.id] = { side: finalSide, entry: res.entry, sl: res.sl, time: Math.floor(now / 1000) };
                saveActiveSigs();
                speakAI(`${finalSide === "LONG" ? "لانگ" : "شورت"} سیگنال روی ${r.id}`);
                UNREAD++; LS("bs_unread", UNREAD); updateUnreadBadge();
            }
        }

        return { ...r, side: finalSide, entry: res.entry, sl: res.sl, tp: res.tp, pass: res.pass || 0, total: res.total || 7, fail: finalFail, rsi: res.rsi, adx: res.adx, checks: res.checks || [], mode: currentMode };
    } catch (e) {
        return { ...r, side: null, pass: 0, total: 7, fail: "خطا در محاسبه", checks: [] };
    }
}

function isSignalOpen(id, side){
  const a = ACTIVE_SIGS[id];
  if(!a) return false;
  if(side && a.side !== side) return false;
  if(Date.now()/1000 - a.time > 6 * 3600) return false; // منقضی شدن بعد از ۶ ساعت
  return true;
}

function sigHtml(r){
    const d=r.d || 2, f=x=> (x == null || isNaN(x)) ? "-" : Number(x).toFixed(d);
    const L=r.side==="LONG";
    const risk= (r.entry && r.sl) ? Math.abs(r.entry-r.sl)/r.entry*100 : 0;
    return `<article class="row sig ${r.side}" data-id="${r.id}" tabindex="0">
    <div class="r-head"><div class="r-id"><span class="sym">${r.id}</span><span style="font-size:11px; padding:2px 8px; background:var(--bd); border-radius:4px; margin-inline-start:8px;">${currentMode === 'range' ? 'رنج' : 'روند'}</span></div><span class="b ${r.side}">${L?"▲":"▼"} ${L?T().long:T().short}</span></div>
    <div class="r-grid"><div><i>${T().entry}</i><b>${f(r.entry)}</b></div><div><i>${T().sl}</i><b class="neg">${f(r.sl)}</b></div><div><i>${T().exit}</i><b class="pos">RSI</b></div></div>
    <div class="r-foot"><span>${T().risk} <bdi>${risk.toFixed(2)}%</bdi></span><span><bdi dir="ltr">RSI ${r.rsi!=null?r.rsi.toFixed(0):"-"}</bdi></span></div></article>`;
}

function noneHtml(r){
    const passCount = r.pass != null ? r.pass : 0;
    const totalCount = r.total != null ? r.total : 7;
    const percent = Math.round((passCount / totalCount) * 100);
    return `<div class="row none" style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--card); border:1px solid var(--bd2); border-radius:12px; margin-bottom:8px;">
      <div class="rn-right" style="display:flex; flex-direction:column; gap:3px;">
        <span class="sym" style="font-weight:700; font-size:15px; color:var(--tx); direction:ltr;">${r.id}</span>
        <span class="why" style="font-size:12px; color:var(--mu);">${r.fail || ''}</span>
      </div>
      <div class="rn-left" style="display:flex; align-items:center; gap:12px;">
        <span class="score" style="font-size:13px; font-weight:700; color:var(--tx2); direction:ltr;">${passCount}/${totalCount}</span>
        <div class="ring-box" style="position:relative; width:38px; height:38px; display:grid; place-items:center;">
          <svg viewBox="0 0 36 36" style="width:100%; height:100%; transform:rotate(-90deg);">
            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--bd)" stroke-width="3.5"/>
            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${passCount >= 5 ? 'var(--gb)' : 'var(--mu)'}" stroke-width="3.5" stroke-dasharray="${percent}, 100"/>
          </svg>
          <span style="position:absolute; font-size:11px; font-weight:800; color:var(--tx); direction:ltr;">${passCount}</span>
        </div>
      </div>
    </div>`;
}

function renderList(){
  try {
      if(!LAST) return;
      let evaluatedRows = LAST.rows.map(evalRow);
      const all = evaluatedRows.filter(r=>r.side), sg = all.filter(r=>vf==="all"||r.side===vf);
      let no = evaluatedRows.filter(r=>!r.side);
      no.sort((a, b) => (b.pass || 0) - (a.pass || 0));

      if($("list")) {
          $("list").innerHTML = 
              (sg.length ? sg.map(sigHtml).join("") : `<div class="empty" style="text-align:center; padding:40px 20px; color:var(--mu);"><div style="font-size:30px; margin-bottom:10px;">🔍</div>${T().noSignalsYet}</div>`) + 
              (no.length ? `<details style="margin-top:16px;"><summary style="cursor:pointer; display:flex; align-items:center; justify-content:space-between; min-height:44px; padding:0 14px; background:var(--card); border:1px solid var(--bd2); border-radius:12px; color:var(--tx2); font-size:13.5px; font-weight:600;"><span>بدون سیگنال (${no.length} نماد)</span><span style="font-size:12px; color:var(--mu);">نمایش رتبه‌بندی ▾</span></summary><div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">${no.map(noneHtml).join("")}</div></details>` : "");
      }
  } catch (err) {}
}

if($("go")) $("go").onclick = () => scan(false);

/* ══════════════ HISTORY MODAL ══════════════ */
let historyTimeFilter = 'all';
let historyTabState = 'open';
const HISTL_KEY = "bs_hist_local";
function loadLocalHist() { try { return JSON.parse(LS(HISTL_KEY) || "[]"); } catch (e) { return []; } }

function setTimeFilter(filter, btnEl) {
    historyTimeFilter = filter;
    document.querySelectorAll('.filter-time-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    updateHistoryModalContent();
}
window.setTimeFilter = setTimeFilter;

function switchHistoryTab(tab, btnEl) {
    historyTabState = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    updateHistoryModalContent();
}
window.switchHistoryTab = switchHistoryTab;

let myStrategyChart = null;
function renderStrategyChart(statsData) {
    const canvasEl = $('strategyPerformanceChart');
    if (!canvasEl) return;
    const ctx = canvasEl.getContext('2d');
    if (myStrategyChart) { myStrategyChart.destroy(); myStrategyChart = null; }
    const dataValues = statsData || [0, 0];
    myStrategyChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['روند', 'رنج'],
            datasets: [{
                label: 'سود کل (R)',
                data: dataValues,
                backgroundColor: ['rgba(70, 197, 140, 0.2)', 'rgba(90, 140, 255, 0.2)'],
                borderColor: ['#46c58c', '#5a8cff'],
                borderWidth: 1.5,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false }, ticks: { color: '#a7aebb', font: { size: 11 } } },
                y: { grid: { color: '#232830' }, ticks: { color: '#a7aebb', font: { size: 11 } } }
            }
        }
    });
}

function updateHistoryModalContent() {
    try {
        const closedHist = loadLocalHist();
        const openSigs = Object.keys(ACTIVE_SIGS).map(id => ({ id, ...ACTIVE_SIGS[id] }));

        if ($('openCount')) $('openCount').textContent = openSigs.length;
        if ($('closedCount')) $('closedCount').textContent = closedHist.length;

        const container = $('signalsContainer');
        if (!container) return;

        let itemsToRender = [];
        let wins = 0, losses = 0, totalPnl = 0;

        closedHist.forEach(item => {
            const pnl = item.R || (item.result === 'win' ? 2.5 : -1);
            totalPnl += pnl;
            if (item.result === 'win') wins++; else losses++;
        });

        const totalTrades = wins + losses;
        const winRate = totalTrades > 0 ? Math.round((wins / totalTrades) * 100) : 0;

        if ($('totalNetPoints')) {
            $('totalNetPoints').textContent = (totalPnl >= 0 ? "+" : "") + totalPnl.toFixed(1) + " R";
            $('totalNetPoints').style.color = totalPnl >= 0 ? "var(--gb)" : "var(--rb)";
        }
        if ($('winLossCounts')) $('winLossCounts').textContent = `${wins} / ${losses}`;
        if ($('totalWinRate')) $('totalWinRate').textContent = `${winRate}%`;

        renderStrategyChart([Math.max(0, totalPnl * 0.7), Math.max(0, totalPnl * 0.3)]);

        if (historyTabState === 'open') {
            itemsToRender = openSigs;
        } else {
            const now = Date.now();
            itemsToRender = closedHist.filter(item => {
                const itemTime = (item.time || item.bt || 0) * (String(item.time).length > 10 ? 1 : 1000);
                if (historyTimeFilter === 'today') return (now - itemTime) <= 24 * 3600 * 1000;
                if (historyTimeFilter === 'week') return (now - itemTime) <= 7 * 24 * 3600 * 1000;
                return true;
            });
        }

        if (itemsToRender.length === 0) {
            container.innerHTML = `<div style="padding:20px; text-align:center; color:var(--mu);">موردی برای نمایش وجود ندارد.</div>`;
            return;
        }

        container.innerHTML = itemsToRender.map(s => {
            const isOpen = historyTabState === 'open';
            const side = s.side || 'LONG';
            const isLong = side === 'LONG';
            return `<div style="background:var(--bg); border:1px solid var(--bd2); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; direction:ltr;">
                <div>
                    <div style="font-weight:700; font-size:14px; color:var(--tx);">${s.id} <span style="font-size:11px; padding:2px 6px; border-radius:4px; background:${isLong?'var(--gd)':'var(--rd)'}; color:${isLong?'var(--gb)':'var(--rb)'}">${side}</span></div>
                    <div style="font-size:11.5px; color:var(--mu); margin-top:3px;">ورود: ${s.entry || '-'} | SL: ${s.sl || '-'}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:13px; font-weight:700; color:${isOpen ? 'var(--tx2)' : (s.result === 'win' ? 'var(--gb)' : 'var(--rb)')};">
                        ${isOpen ? 'در حال پایش...' : (s.result === 'win' ? 'تارگت موفق (+R)' : 'حد ضرر (-1R)')}
                    </div>
                </div>
            </div>`;
        }).join("");
    } catch (e) {}
}

if($("showHist")) $("showHist").onclick = () => {
    UNREAD = 0; LS("bs_unread", 0); updateUnreadBadge();
    if($("histModal")) $("histModal").style.display = "block";
    updateHistoryModalContent();
};
if($("closeHist")) $("closeHist").onclick = () => { if($("histModal")) $("histModal").style.display = "none"; };

/* ══════════════ INIT ══════════════ */
try { 
    applyLanguage(); 
    updateSplashLangUi(); 
} catch(e) {}
</script>
