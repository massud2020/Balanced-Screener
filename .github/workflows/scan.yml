name: Balanced Screener Scan

on:
  workflow_dispatch: # امکان اجرای دستی
  schedule:
    - cron: '*/15 * * * *' # اجرای خودکار هر ۱۵ دقیقه (می‌توانید تغییر دهید)

# 🛠️ این خط بسیار مهم است: به اکشن اجازه می‌دهد فایل‌ها را در ریپازیتوری ذخیره کند
permissions:
  contents: write 

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scanner
        env:
          # توکن‌ها باید در بخش Secrets ریپازیتوری شما تعریف شده باشند
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV || 'practice' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # سایر تنظیمات (در صورت نیاز)
          M15: ${{ secrets.M15 }}
          H1: ${{ secrets.H1 }}
          RSI: ${{ secrets.RSI }}
        run: node scan.js

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # اضافه کردن فایل‌های تولید شده
          git add data.json history.json latest_signal.txt
          # کامیت کردن تغییرات (اگر تغییری نبود، ارور ندهد)
          git commit -m "Update market data [skip ci]" || echo "No changes to commit"
          # پوش کردن به گیت‌هاب
          git push
