name: Balanced Screener Scan

on:
  workflow_dispatch: # اجرای دستی
  schedule:
    - cron: '*/15 * * * *' # اجرای خودکار هر ۱۵ دقیقه

# 🛠️ این خط برای اجازه دادن به اکشن جهت کامیت کردن و ذخیره فایل data.json است
permissions:
  contents: write 

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV || 'practice' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scan.js

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 🛠️ این خط تمام فایل‌های تغییر یافته را اضافه می‌کند (حتی اگر جدید باشند)
          git add -A
          git commit -m "Update market data [skip ci]" || echo "No changes to commit"
          git push
