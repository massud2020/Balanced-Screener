name: Update News Calendar
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and filter news
        run: |
          curl -s "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o raw.json || echo "[]" > raw.json
          python3 -c "
import json
from datetime import datetime, timezone
try:
    with open('raw.json') as f:
        data = json.load(f)
except:
    data = []
now = datetime.now(timezone.utc)
events = []
for ev in data:
    if ev.get('impact') != 'High':
        continue
    try:
        dt = datetime.fromisoformat(ev['date'].replace('Z', '+00:00'))
        if dt < now:
            continue
        events.append({
            'time': dt.isoformat(),
            'title': ev.get('title', ''),
            'impact': 'high',
            'currency': ev.get('country', '')
        })
    except:
        continue
events.sort(key=lambda x: x['time'])
out = {'updated': now.isoformat(), 'events': events[:30]}
with open('news.json', 'w') as f:
    json.dump(out, f, indent=2)
print(f'Wrote {len(events)} events')
"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news calendar [skip ci]"
          git push
