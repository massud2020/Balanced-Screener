name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. دریافت کدها
      - name: Checkout Code
        uses: actions/checkout@v5

      # 2. تنظیم Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 3. تنظیم Java روی نسخه 21
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. نصب پیش‌نیازهای سیستم
      - name: Install System Dependencies
        run: |
          echo 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeout
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-timeout
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-timeout

          sudo sed -i -E 's@//azure\.archive\.ubuntu\.com@//archive.ubuntu.com@g' /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libarchive-tools

      # 5. نصب پکیج‌های Node.js
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
          else
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          fi

      # 6. نصب پلاگین TTS
      - name: Install TTS Plugins
        run: |
          npm install @capacitor-community/text-to-speech --legacy-peer-deps

      # 7. آماده‌سازی پوشه www
      - name: Build www folder
        run: |
          mkdir -p www
          cp index.html engine.js sw.js data.json www/ 2>/dev/null || true

      # 8. استمپ Service Worker
      - name: Stamp service worker
        run: |
          if [ -f www/sw.js ]; then
            echo "// Build time: $(date +%s)" >> www/sw.js
          fi

      # 9. حذف پوشه اندروید قبلی
      - name: Remove Old Android Folder
        run: |
          rm -rf android

      # 10. اضافه کردن پلتفرم اندروید، تنظیم گرادل 8.7 و تزریق صحیح قانون BouncyCastle
      - name: Add Capacitor Android platform and Fix BouncyCastle
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.balanced.screener","appName":"Balanced Screener","webDir":"www"}' > capacitor.config.json
          fi
          npx cap add android
          npx cap sync android
          
          # تنظیم نسخه گرادل به 8.7
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-.*-bin.zip/gradle-8.7-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # تزریق اصولی قانون اجبار نسخه 1.76 به ابتدای فایل build.gradle
          if [ -f android/build.gradle ]; then
            TEMP_FILE=$(mktemp)
            echo "allprojects {
                configurations.all {
                    resolutionStrategy.eachDependency { details ->
                        if (details.requested.group == 'org.bouncycastle' && details.requested.name == 'bcprov-jdk18on') {
                            details.useVersion '1.76'
                            details.because 'Fix bytecode incompatibility with Java 21'
                        }
                    }
                }
            }" > "$TEMP_FILE"
            cat android/build.gradle >> "$TEMP_FILE"
            mv "$TEMP_FILE" android/build.gradle
          fi

      # 11. ساخت آیکون‌ها و اسپلش
      - name: Generate Android Icons and Splash
        run: |
          if [ -d "resources" ]; then
            npm install @capacitor/assets --legacy-peer-deps
            npx capacitor-assets generate --android
          fi

      # 12. پاکسازی کش‌های گرادل
      - name: Clean Gradle Caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 13. بیلد نهایی APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --refresh-dependencies

      # 14. آپلود خروجی
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Balanced-Screener-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
