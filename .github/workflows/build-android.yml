name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🛠️ استفاده از Java 21 (الزامی برای Capacitor 7)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install TTS Plugins
        run: |
          npm install @capacitor-community/text-to-speech --legacy-peer-deps
          npm install capacitor-edge-tts --legacy-peer-deps

      - name: Build www folder
        run: node build-www.js

      - name: Add Capacitor Android platform
        run: npx cap add android

      # 🛠️ پاک‌سازی کامل کش Gradle برای جلوگیری از خطاهای ناشی از فایل‌های خراب
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 🛠️ تنظیم نسخه AGP به 8.13.0 (هماهنگ با Java 21 و Gradle 8.14.3)
      - name: Set AGP Version to 8.13.0
        run: |
          sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.13.0/' android/build.gradle

      # 🛠️ تنظیم gradle.properties برای سازگاری و جلوگیری از خطای حافظه
      - name: Update gradle.properties
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Generate Android Icons and Splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0d11' --iconBackgroundColorDark '#0b0d11' --splashBackgroundColor '#0b0d11' --splashBackgroundColorDark '#0b0d11'

      - name: Sync Capacitor
        run: npx cap sync android

      # 🛠️ تنظیم نسخه Gradle به 8.14.3 (هماهنگ با AGP 8.13.0)
      - name: Set Gradle Version to 8.14.3
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: balanced-screener-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
