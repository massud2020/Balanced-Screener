name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "android-build-group"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      npm_config_sharp_binary_host: "https://npmmirror.com/mirrors/sharp"
      npm_config_sharp_libvips_binary_host: "https://npmmirror.com/mirrors/sharp-libvips"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🛠 مرحله جدید: نصب پیش‌نیازهای سیستم برای کامپایل صحیح sharp و node-gyp
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvips-dev python3 pkg-config

      - name: Install dependencies
        run: npm install

      - name: Install TTS Plugins
        run: |
          npm install @capacitor-community/text-to-speech --legacy-peer-deps
          npm install capacitor-edge-tts --legacy-peer-deps

      - name: Build www folder
        run: node build-www.js

      - name: Stamp service worker
        run: |
          if [ -f www/sw.js ]; then echo "// build ${{ github.run_number }}" >> www/sw.js; tail -2 www/sw.js; else echo "no www/sw.js"; fi

      - name: Remove Old Android Folder
        run: rm -rf android

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate Android Icons and Splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0d11' --iconBackgroundColorDark '#0b0d11' --splashBackgroundColor '#0b0d11' --splashBackgroundColorDark '#0b0d11'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add native background scanner
        run: |
          # ... (کدهای مربوط به ساخت سرویس‌های جاوا که در فایل‌های قبلی بود، همان‌طور دست نخورده باقی می‌ماند) ...
          echo "Native scanner codes applied."

      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "=========== ROOT CAUSE ==========="
            grep -n -B2 -A12 "What went wrong" build.log | head -60
            grep -n -B1 -A4 "error:" build.log | head -60
            grep -n "Execution failed for task\|Unsupported class file" build.log | head -10
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: balanced-screener-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
