name: Build Android APK

on:
  workflow_dispatch: # اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. دریافت کدها
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تنظیم Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. تنظیم Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تنظیم Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. نصب پیش‌نیازهای سیستم (دور زدن سرورهای کند و جلوگیری از تایم‌اوت)
      - name: Install System Dependencies
        run: |
          # کاهش تایم‌اوت به 15 ثانیه
          echo 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeout
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-timeout
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-timeout
          
          # دور زدن سرورهای پیش‌فرض گیت‌هاب (Azure) و استفاده از سرور اصلی اوبونتو
          sudo sed -i -E 's@//azure\.archive\.ubuntu\.com@//archive.ubuntu.com@g' /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          
          # آپدیت و نصب
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libarchive-tools

      # 6. نصب پکیج‌های Node.js
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi

      # 7. نصب پلاگین‌های TTS
      - name: Install TTS Plugins
        run: |
          npm install @capacitor-community/text-to-speech

      # 8. آماده‌سازی پوشه www
      - name: Build www folder
        run: |
          mkdir -p www
          # کپی کردن فایل‌های استاتیک (در صورت نیاز نام فایل‌ها را تغییر دهید)
          cp index.html engine.js sw.js data.json www/ 2>/dev/null || true

      # 9. استمپ کردن Service Worker
      - name: Stamp service worker
        run: |
          if [ -f www/sw.js ]; then
            echo "// Build time: $(date +%s)" >> www/sw.js
          fi

      # 10. حذف پوشه اندروید قبلی
      - name: Remove Old Android Folder
        run: |
          rm -rf android

      # 11. اضافه کردن پلتفرم اندروید Capacitor
      - name: Add Capacitor Android platform
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.balanced.screener","appName":"Balanced Screener","webDir":"www"}' > capacitor.config.json
          fi
          npx cap add android
          npx cap sync android

      # 12. ساخت آیکون‌ها و اسپلش اسکرین
      - name: Generate Android Icons and Splash
        run: |
          if [ -d "resources" ]; then
            npm install @capacitor/assets
            npx capacitor-assets generate --android
          fi

      # 13. بیلد نهایی فایل APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 14. آپلود فایل APK برای دانلود
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Balanced-Screener-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
