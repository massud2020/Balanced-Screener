name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🛠️ استفاده از Java 21 (الزامی برای Capacitor 7)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install TTS Plugins
        run: |
          npm install @capacitor-community/text-to-speech --legacy-peer-deps
          npm install capacitor-edge-tts --legacy-peer-deps

      - name: Build www folder
        run: node build-www.js

      # 🛠️ حذف پوشه اندروید قدیمی برای رفع کامل خطاهای ساختاری
      - name: Remove Old Android Folder
        run: rm -rf android

      # 🛠️ بازسازی پوشه اندروید از صفر
      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate Android Icons and Splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0d11' --iconBackgroundColorDark '#0b0d11' --splashBackgroundColor '#0b0d11' --splashBackgroundColorDark '#0b0d11'

      # 🛠️ سینک کردن Capacitor (این مرحله ممکن است فایل gradle.properties را بازنویسی کند)
      - name: Sync Capacitor
        run: npx cap sync android

      # 🛠️ تنظیمات را بعد از سینک اعمال می‌کنیم تا بازنویسی نشود
      - name: Configure Jetifier to Ignore BouncyCastle
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.jetifier.ignorelist=bcprov-jdk18on,bcprov-jdk18on-1.79.jar" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      # 🛠️ پاک‌سازی کامل تمام کش‌ها (هم کش سراسری و هم کش پروژه)
      - name: Clean All Caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf android/.gradle/
          rm -rf android/build/
          rm -rf android/app/build/

      # 🛠️ بیلد نهایی
      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: balanced-screener-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
