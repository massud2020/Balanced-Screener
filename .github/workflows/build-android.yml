name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install TTS Plugins
        run: |
          npm install @capacitor-community/text-to-speech --legacy-peer-deps
          npm install capacitor-edge-tts --legacy-peer-deps

      - name: Build www folder
        run: node build-www.js

      - name: Remove Old Android Folder
        run: rm -rf android

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Generate Android Icons and Splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0d11' --iconBackgroundColorDark '#0b0d11' --splashBackgroundColor '#0b0d11' --splashBackgroundColorDark '#0b0d11'

      - name: Sync Capacitor
        run: npx cap sync android

      # 🛠️ ایجاد اسکریپت Init برای اجبار Gradle به استفاده از نسخه سازگار Bouncy Castle
      - name: Force BouncyCastle Version via Init Script
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk18on:1.76'
                  }
              }
          }
          EOF

      # 🛠️ پاک‌سازی کامل کش‌ها
      - name: Clean All Caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf android/.gradle/
          rm -rf android/build/
          rm -rf android/app/build/

      # 🛠️ بیلد نهایی
      - name: Build APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: balanced-screener-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
