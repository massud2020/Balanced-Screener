name: Balanced Screener Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # هر ۵ دقیقه

jobs:
  run_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }} # توکن شما از Secrets
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SIGNAL_THREAD_ID: ${{ secrets.TELEGRAM_SIGNAL_THREAD_ID }}
        run: node scan.js
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add latest_signal.txt
          git add .state/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update signal and state from v34"
          git push
