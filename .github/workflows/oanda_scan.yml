name: Balanced Screener Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: 270
          INTERVAL: 60
          M15: "1"
          H1: "0"
          RSI: "1"
          RSI_L: "40"
          RSI_S: "60"
        run: node scan.js
        
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git add history.json
          if [ -f latest_signal.txt ]; then
            git add latest_signal.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update data and signals"
            git push
          else
            echo "No new signals"
          fi
