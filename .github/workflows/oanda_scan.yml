name: Run Background Scanner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *' # اجرای خودکار هر ۱۵ دقیقه
  workflow_dispatch:

# 👈 این بخش جادویی است: از اجرای همزمان دو اسکنر جلوگیری می‌کند و سیگنال تکراری را ریشه‌کن می‌کند
concurrency:
  group: "scanner-group"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      # تنظیمات آینه برای دانلود سریع پکیج‌ها
      npm_config_sharp_binary_host: "https://npmmirror.com/mirrors/sharp"
      npm_config_sharp_libvips_binary_host: "https://npmmirror.com/mirrors/sharp-libvips"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      
      # توکن‌ها و تنظیمات (مطمئن شوید این مقادیر در Secrets گیت‌هاب تنظیم شده‌اند)
      OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
      OANDA_ENV: ${{ secrets.OANDA_ENV }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SIGNALS_THREAD_ID: ${{ secrets.TELEGRAM_SIGNALS_THREAD_ID }}
      TELEGRAM_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_ALERTS_THREAD_ID }}
      
      # تنظیمات استراتژی
      M15: "1"
      H1: "1"
      RSI: "1"
      RSI_L: "38"
      RSI_S: "62"
      MODES: "pattern,range"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Scanner
        run: node scan.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json latest_signal.txt
          git commit -m "Update scanner data [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
