name: Balanced Screener Scan

on:
  # 🛠️ اجرای دستی
  workflow_dispatch:

  # 🛠️ زمان‌بندی پشتیبان (هر ۵ دقیقه)
  schedule:
    - cron: '*/5 * * * *'

# 🛠️ جلوگیری از اجرای همزمان چند اسکن
concurrency:
  group: scan-market
  cancel-in-progress: false

permissions:
  contents: write # دسترسی نوشتن برای کامیت کردن

jobs:
  run_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: 270
          INTERVAL: 60
          M15: "1"
          H1: "0"
          RSI: "1"
          RSI_L: "40"
          RSI_S: "60"
        run: node scan.js
        
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 🛠️ دریافت آخرین تغییرات از گیت‌هاب (برای اینکه اگر کد جدیدی اضافه کردید از دست نرود)
          git fetch origin main
          
          # 🛠️ ریست کردن وضعیت لوکال به آخرین نسخه گیت‌هاب (اما فایل‌های تولید شده جدید ما دست نخورده باقی می‌مانند)
          git reset --mixed origin/main
          
          # 🛠️ اضافه کردن فایل‌های جدید
          git add data.json history.json
          
          # 🛠️ کامیت کردن
          git commit -m "Update market data [skip ci]" || echo "No changes to commit"
          
          # 🛠️ پوش کردن
          git push origin main
