name: Balanced Screener Scan (1 Min)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner (1 Min Loop)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SIGNAL_THREAD_ID: ${{ secrets.TELEGRAM_SIGNAL_THREAD_ID }}
          LOOP_SECONDS: 270  
          INTERVAL: 60       
        run: node scan.js
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 🛠️ اضافه کردن فایل دیتای داشبورد
          git add data.json
          
          # 🛠️ اضافه کردن فایل تاریخچه برای دکمه 📅
          git add history.json
          
          # 🛠️ فایل سیگنال فقط اگر سیگنالی پیدا شده باشد اضافه می‌شود
          if [ -f latest_signal.txt ]; then
            git add latest_signal.txt
          fi
          
          # 🛠️ کامیت فقط در صورتی که تغییرات جدیدی وجود داشته باشد
          if ! git diff --cached --quiet; then
            git commit -m "Update signal, data, and history"
            git push
          else
            echo "No new signals found. Nothing to commit."
          fi
