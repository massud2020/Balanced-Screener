name: Balanced Screener Scan

on:
  # 🛠️ ۱. اجرای دستی (از داخل خود گیت‌هاب)
  workflow_dispatch:

  # 🛠️ ۲. زمان‌بندی داخلی گیت‌هاب (هر ۵ دقیقه)
  schedule:
    - cron: '*/5 * * * *'

# 🛠️ جلوگیری از اجرای همزمان و بروز خطاهای تداخل (بسیار مهم)
concurrency:
  group: scan-market
  cancel-in-progress: false

permissions:
  contents: write # دسترسی نوشتن برای کامیت کردن فایل data.json

jobs:
  run_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: 270
          INTERVAL: 60
          M15: "1"
          H1: "0"
          RSI: "1"
          RSI_L: "40"
          RSI_S: "60"
        run: node scan.js
        
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json history.json
          git commit -m "Update market data [skip ci]" || echo "No changes to commit"
          git push
