name: Balanced Screener Scan

on:
  # 🛠️ اجرای دستی
  workflow_dispatch:

  # 🛠️ زمان‌بندی داخلی گیت‌هاب (پشتیبان - هر ۱۵ دقیقه)
  # کارهای ۵ دقیقه‌ای توسط cron-job.org انجام می‌شود
  schedule:
    - cron: '*/15 * * * *'

# 🛠️ جلوگیری از اجرای همزمان
concurrency:
  group: scan-market
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: 270
          INTERVAL: 60
          M15: "1"
          H1: "0"
          RSI: "1"
          RSI_L: "40"
          RSI_S: "60"
        run: node scan.js
        
      # 🛠️ اسکریپت نهایی و ضدخطا برای ذخیره فایل
      - name: Force Commit and Push
        run: |
          # ۱. فایل‌های جدیدی که اسکنر ساخت را در یک پوشه موقت کپی می‌کنیم
          cp data.json /tmp/data.json
          cp history.json /tmp/history.json
          
          # ۲. ریپازیتوری را به آخرین نسخه گیت‌هاب برمی‌گردانیم (حذف کامل تغییرات قدیمی)
          git fetch origin main
          git reset --hard origin/main
          
          # ۳. فایل‌های جدید خودمان را جایگزین می‌کنیم
          cp /tmp/data.json data.json
          cp /tmp/history.json history.json
          
          # ۴. تنظیمات گیت و کامیت کردن
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json history.json
          git commit -m "Update market data [skip ci]" || echo "No changes to commit"
          
          # ۵. پوش کردن به گیت‌هاب
          git push origin main
