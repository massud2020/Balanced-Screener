name: Balanced Screener Scan

on:
  # 🛠️ اجرای دستی
  workflow_dispatch:

  # 🛠️ زمان‌بندی داخلی پشتیبان (هر ۱۵ دقیقه، تا با cron-job تداخل نداشته باشد)
  schedule:
    - cron: '*/15 * * * *'

# 🛠️ جلوگیری از اجرای همزمان چند اسکن
concurrency:
  group: scan-market
  cancel-in-progress: false

permissions:
  contents: write # دسترسی نوشتن برای کامیت کردن

jobs:
  run_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scanner
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: "practice"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: 270
          INTERVAL: 60
          M15: "1"
          H1: "0"
          RSI: "1"
          RSI_L: "40"
          RSI_S: "60"
        run: node scan.js
        
      # 🛠️ استفاده از اکشن استاندارد برای کامیت و پوش (بدون خطا و تداخل)
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update market data [skip ci]"
          file_pattern: "data.json history.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
