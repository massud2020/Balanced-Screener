function statsCard(m,tr,risk,bk,mh){const s=metrics(tr,risk),c=COL[m];if(!s.n)return`<div class="sc" style="--c:${c}"><h4>${NAME[m]}</h4><div class="hint" style="margin-top:8px">در این داده هیچ معامله‌ای نبسته نشد.</div></div>`;

<div class="split"><div><span>۷۰٪ اول زمان</span>${ln(a)}</div><div><span>۳۰٪ آخر زمان</span>${ln(b)}</div><div><span>لانگ / شورت</span><bdi dir="ltr">${fa(s.longs)} (${f2(s.avgLong)}R) / ${fa(s.shorts)} (${f2(s.avgShort)}R)</bdi></div><div><span>میانگین نگهداری</span><bdi dir="ltr">${f2(s.avgBars*5/60,1)} h</bdi></div></div>

function drawEq(cv,series){const W=cv.parentNode.clientWidth||340,H=240,dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle="#12151b";g.fillRect(0,0,W,H);
