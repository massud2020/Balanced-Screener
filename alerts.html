<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>هشدار قیمت · Screener</title>
<style>
:root{--bg:#0b0d11;--card:#12151b;--card2:#171b22;--bd:#232830;--bd2:#1b1f27;--tx:#e6e9ee;--tx2:#a7aebb;--mu:#78808d;--g:#2e9a69;--gb:#46c58c;--gd:rgba(46,154,105,.14);--r:#d4524c;--rb:#e8736d;--rs:12px;--rad:16px;--font:"Segoe UI",system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 var(--font);min-height:100dvh;padding:0 14px calc(env(safe-area-inset-bottom) + 40px);-webkit-font-smoothing:antialiased}
bdi{unicode-bidi:isolate}button,select,input,textarea{font:inherit;color:var(--tx)}
button,a.btn{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:0 14px;min-height:44px;font-size:14px;cursor:pointer;color:var(--tx);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gb);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,13,17,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}.brand i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#7a5a14,#f2b53b);font-style:normal;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:14px;margin-top:14px}
h2{font-size:15px;margin-bottom:6px}h3{font-size:12px;color:var(--mu);font-weight:600;margin:14px 0 6px}
.hint{color:var(--mu);font-size:12.5px;line-height:1.9}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.top b{font-size:15px}.top small{display:block;color:var(--mu);font-size:12px}
button.p{background:linear-gradient(120deg,#c98a12,#f2b53b);border:none;color:#1a1200;font-weight:800;min-height:46px;padding:0 18px;box-shadow:0 4px 18px rgba(242,181,59,.25)}
.al{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:13px 14px;margin-top:10px;animation:up .22s ease both}
.al::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c,#f2b53b)}.al.up{--c:var(--gb)}.al.dn{--c:var(--rb)}.al.tm{--c:#6db4ff}.al.off{opacity:.5}
.ah{display:flex;align-items:center;justify-content:space-between;gap:10px}.sym{font-weight:700;font-size:16px;direction:ltr}.ac{margin-top:8px;font-size:14px}.ac b{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.am{margin-top:6px;color:var(--mu);font-size:12px;line-height:1.8}.ab{display:flex;gap:8px;margin-top:10px}.ab button{min-height:36px;font-size:13px;padding:0 14px}.ab .del{color:var(--rb)}
.chip{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--bd);color:var(--tx2);margin-inline-start:6px}
.sw{-webkit-appearance:none;appearance:none;flex:none;width:44px;height:26px;border-radius:99px;background:#2a2e37;position:relative;cursor:pointer;transition:background .2s}.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#cfd3da;transition:inset-inline-start .2s}.sw:checked{background:var(--g)}.sw:checked::after{inset-inline-start:21px;background:#fff}
.empty{text-align:center;color:var(--mu);padding:34px 16px;font-size:14px;line-height:2}.empty b{display:block;font-size:34px}
/* form sheet */
#sh{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);overflow:auto}#sh.on{display:block}
.sheet{background:var(--bg);border:1px solid var(--bd);border-radius:20px 20px 0 0;margin-top:max(40px,8vh);min-height:calc(100% - max(40px,8vh));padding:16px 14px calc(env(safe-area-inset-bottom) + 24px);animation:up .25s ease}
.sheet h2{font-size:17px;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mu);margin-top:12px}
.fld input,.fld select,.fld textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 12px;min-height:44px;font-size:15px;width:100%;direction:ltr;text-align:right}.fld textarea{direction:rtl;min-height:64px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:3px;gap:3px;margin-top:6px}.seg button{flex:1;border:none;background:transparent;min-height:40px;border-radius:9px;font-size:13px;padding:0 6px;color:var(--mu)}.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 6px rgba(0,0,0,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{min-height:38px;min-width:40px;padding:0 11px;border-radius:99px;font-size:13px;color:var(--mu)}.chips button.on{background:var(--gd);border-color:rgba(70,197,140,.4);color:var(--gb)}
.chips .tm{direction:ltr;color:var(--tx)}.chips .tm::after{content:" ✕";color:var(--rb);font-size:11px}
.cur{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--tx2);flex-wrap:wrap}.cur b{direction:ltr;font-variant-numeric:tabular-nums}.cur button{min-height:30px;font-size:12px;padding:0 10px}
.err{color:var(--rb);font-size:13px;margin-top:10px;min-height:20px}
.btns{display:flex;gap:10px;margin-top:14px}.btns button{flex:1}
.toast{position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:100;max-width:430px;margin:0 auto;background:rgba(23,27,34,.97);border:1px solid var(--bd);border-inline-start:4px solid var(--gb);border-radius:14px;padding:11px 14px;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.55);animation:up .25s ease;display:none}.toast.on{display:block}.toast.er{border-inline-start-color:var(--rb)}
.in{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:0 11px;min-height:42px;font-size:14px;direction:ltr;width:100%}
.sync label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu);margin-top:10px}.sy{font-size:12.5px;margin-top:10px;line-height:1.9;color:var(--tx2)}.sy.ok{color:var(--gb)}.sy.er{color:var(--rb)}
.sy pre{direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:11.5px;white-space:pre-wrap;word-break:break-all;margin:6px 0;max-height:180px;overflow:auto;user-select:all}.sy a{color:var(--gb);margin-inline-end:12px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="brand"><i>🔔</i><div>هشدار قیمت</div></div><a class="btn" href="index.html">← اسکرینر</a></header>

<div class="top"><div><b id="cnt">۰ هشدار</b><small id="sub">برای هر نماد و ساعت دلخواه</small></div><button class="p" id="add">＋ هشدار جدید</button></div>
<div id="list"></div>

<section class="card sync">
  <h2>اعلان وقتی اپ بسته است</h2>
  <p class="hint">هشدارها هر دقیقه روی GitHub بررسی می‌شن و با ntfy برات می‌آن. برای این‌که اونجا هم ثبت بشن، تنظیمات رو روی سرور ذخیره کن. وقتی اپ بازه هم خود اپ هر دقیقه چکشون می‌کنه.</p>
  <label>ریپازیتوری GitHub (user/repo)<input class="in" id="ghr" placeholder="user/repo" autocomplete="off"></label>
  <label>GitHub token (اختیاری، برای ذخیره‌ی خودکار)<input class="in" id="ght" type="password" placeholder="github_pat_…" autocomplete="off"></label>
  <label>منطقه‌ی زمانی ساعت‌ها<input class="in" id="tz" placeholder="Asia/Tehran" autocomplete="off"></label>
  <div class="btns"><button id="push">ذخیره روی سرور</button><button id="pull">دریافت از سرور</button></div>
  <div class="sy" id="sy"></div>
</section>

<div id="sh"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<datalist id="syms"></datalist>
<script src="symbols.js?v=34"></script><script src="alerts.js?v=34"></script><script src="ghsync.js?v=34"></script>
<script>
const $=i=>document.getElementById(i),fa=n=>Number(n).toLocaleString("fa-IR"),LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const DAYS=[[6,"ش"],[0,"ی"],[1,"د"],[2,"س"],[3,"چ"],[4,"پ"],[5,"ج"]],DN={0:"یکشنبه",1:"دوشنبه",2:"سه‌شنبه",3:"چهارشنبه",4:"پنجشنبه",5:"جمعه",6:"شنبه"};
const norm=s=>String(s==null?"":s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٬,،\s]/g,"").replace(/٫/g,".");
let cfg={tz:"",alerts:[]},edit=null,timer=null;
const devTz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"}catch(e){return"UTC"}};
function toast(m,er){const t=$("toast");t.textContent=m;t.className="toast on"+(er?" er":"");clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="toast",3200)}
function load(){try{const c=JSON.parse(LS("bs_alerts")||"null");if(c&&Array.isArray(c.alerts))cfg=c}catch(e){}cfg.tz=LS("bs_altz")||cfg.tz||devTz()}
function persist(){cfg.tz=($("tz").value||"").trim()||devTz();LS("bs_altz",cfg.tz);LS("bs_alerts",JSON.stringify({tz:cfg.tz,alerts:cfg.alerts}));LS("bs_al_dirty","1");render();autoSync()}
const money=(a)=>AL.fmt(a.price);
function descr(a){if(a.type==="every")return`⏱ ارسال قیمت <b>هر ${fa(a.every)} دقیقه</b>`;if(a.type==="time")return`🕘 ارسال قیمت در ساعت‌های <b>${(a.at||[]).join("، ")}</b>`;return`${a.type==="above"?"▲ وقتی قیمت بالاتر یا مساوی":"▼ وقتی قیمت پایین‌تر یا مساوی"} <b>${money(a)}</b> شد`}
function meta(a){const p=[];if(a.from&&a.to&&a.from!==a.to)p.push(`فقط ${a.from} تا ${a.to}`);const d=a.days||[];if(d.length&&d.length<7)p.push("روزها: "+DAYS.filter(x=>d.includes(x[0])).map(x=>x[1]).join(" "));else p.push("همه‌ی روزها");if(a.type==="above"||a.type==="below")p.push(a.repeat==="cool"?`تکرار هر ${fa(a.cool||60)} دقیقه`:"فقط یک‌بار");if(a.note)p.push("«"+a.note+"»");return p.join(" · ")}
function render(){const n=cfg.alerts.filter(a=>a.on!==false).length;$("cnt").textContent=fa(cfg.alerts.length)+" هشدار"+(cfg.alerts.length?` · ${fa(n)} فعال`:"");
$("list").innerHTML=cfg.alerts.length?cfg.alerts.map(a=>`<article class="al ${a.type==="above"?"up":a.type==="below"?"dn":"tm"}${a.on===false?" off":""}" data-id="${a.id}"><div class="ah"><div><span class="sym">${a.sym}</span><span class="chip">${a.type==="every"?"دوره‌ای":a.type==="time"?"زمان‌بندی":a.type==="above"?"بالاتر":"پایین‌تر"}</span></div><input type="checkbox" class="sw" data-t="${a.id}" ${a.on===false?"":"checked"} aria-label="فعال/غیرفعال"></div><div class="ac">${descr(a)}</div><div class="am">${meta(a)}</div><div class="ab"><button data-e="${a.id}">ویرایش</button><button class="del" data-d="${a.id}">حذف</button></div></article>`).join(""):'<div class="empty"><b>🔔</b>هنوز هشداری نساختی.<br>با «هشدار جدید» یه سطح قیمت یا ساعت مشخص تعریف کن.</div>'}
$("list").onclick=e=>{const t=e.target.closest("[data-t]");if(t){const a=cfg.alerts.find(x=>x.id===t.dataset.t);if(a){a.on=t.checked;persist()}return}
const ed=e.target.closest("[data-e]");if(ed){openForm(cfg.alerts.find(x=>x.id===ed.dataset.e));return}
const d=e.target.closest("[data-d]");if(d){const i=cfg.alerts.findIndex(x=>x.id===d.dataset.d);if(i>=0&&confirm("این هشدار حذف شود؟")){cfg.alerts.splice(i,1);persist();toast("هشدار حذف شد")}}};
/* ---- current price helper ---- */
const PX=[u=>u,u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];
async function J(url,prox){let e;for(const p of prox?PX:[PX[0]]){try{const r=await fetch(p(url),{signal:AbortSignal.timeout(9000)});if(r.ok)return await r.json()}catch(x){e=x}}throw e||new Error("fetch")}
async function getPrice(sym){const u=AL.resolve(sym,U);
if(u[1]){try{const j=await J(`https://www.okx.com/api/v5/market/ticker?instId=${u[1]}`,false);if(j.code==="0"&&j.data[0])return+j.data[0].last}catch(e){}}
if(u[4]&&LS("bs_tok")){try{const h=LS("bs_env")==="live"?"api-fxtrade":"api-fxpractice",r=await fetch(`https://${h}.oanda.com/v3/instruments/${u[4]}/candles?granularity=M5&count=2&price=M`,{headers:{Authorization:"Bearer "+LS("bs_tok")}});if(r.ok){const j=await r.json();return+j.candles[j.candles.length-1].mid.c}}catch(e){}}
if(u[2]){try{const j=await J(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(u[2])}?interval=5m&range=1d`,true);return+j.chart.result[0].meta.regularMarketPrice}catch(e){}}return null}
/* ---- form ---- */
const EVERY=[1,5,10,15,30,60,120,240];
function openForm(a){edit=a?JSON.parse(JSON.stringify(a)):{id:"a"+Date.now().toString(36),sym:"",type:"above",price:"",at:[],every:5,from:"",to:"",days:[],repeat:"once",cool:60,on:true,note:""};if(!edit.at)edit.at=[];if(!edit.every)edit.every=5;edit._new=!a;draw();$("sh").classList.add("on");document.body.style.overflow="hidden"}
function closeForm(){$("sh").classList.remove("on");document.body.style.overflow=""}
function draw(){const a=edit,time=a.type==="time",every=a.type==="every",price=!time&&!every;
$("sheet").innerHTML=`<h2>${a._new?"هشدار جدید":"ویرایش هشدار"}</h2>
<label class="fld">نماد<input id="fs" list="syms" value="${a.sym}" placeholder="مثلاً BTCUSDT یا EURUSD یا AAPL" autocomplete="off" autocapitalize="characters"></label>
<div class="seg" id="ft">${[["above","▲ بالاتر"],["below","▼ پایین‌تر"],["every","⏱ دوره‌ای"],["time","🕘 ساعت"]].map(([v,t])=>`<button data-v="${v}" class="${a.type===v?"on":""}">${t}</button>`).join("")}</div>
${price?`<label class="fld">قیمت هدف<input id="fp" inputmode="decimal" value="${a.price}" placeholder="مثلاً 68000"></label><div class="cur" id="cur"><span>قیمت فعلی: <b id="cv">—</b></span><button id="cgo" type="button">دریافت</button><span id="cq"></span></div>`:""}
${every?`<div class="fld">هر چند دقیقه قیمت برایم ارسال شود؟<div class="chips" id="fe2">${EVERY.map(n=>`<button data-n="${n}" class="${a.every===n?"on":""}">${n>=60?fa(n/60)+" ساعت":fa(n)+" دقیقه"}</button>`).join("")}</div><div class="row2" style="margin-top:8px"><input id="fev" inputmode="numeric" value="${a.every}" aria-label="دقیقه"><span class="hint" style="align-self:center">دقیقه (۱ تا ۱۴۴۰)</span></div></div><div class="hint" id="warn" style="margin-top:8px"></div>`:""}
${time?`<div class="fld">ساعت‌های ارسال قیمت (به وقت منطقه‌ی زمانی)<div class="chips" id="fa">${(a.at||[]).map(t=>`<button class="tm" data-r="${t}">${t}</button>`).join("")}</div><div class="row2" style="margin-top:8px"><input id="fnt" type="time"><button id="fadd" type="button">＋ افزودن ساعت</button></div></div>`:""}
<h3>زمان‌های فعال بودن (اختیاری)</h3>
${time?"":`<div class="row2"><label class="fld" style="margin-top:0">از ساعت<input id="ff" type="time" value="${a.from||""}"></label><label class="fld" style="margin-top:0">تا ساعت<input id="fto" type="time" value="${a.to||""}"></label></div>`}
<div class="fld">روزهای هفته (خالی = همه)<div class="chips" id="fd">${DAYS.map(([v,l])=>`<button data-d="${v}" class="${(a.days||[]).includes(v)?"on":""}" title="${DN[v]}">${l}</button>`).join("")}</div></div>
${price?`<div class="row2"><label class="fld">تکرار<select id="fr"><option value="once" ${a.repeat!=="cool"?"selected":""}>فقط یک‌بار</option><option value="cool" ${a.repeat==="cool"?"selected":""}>تکرار با فاصله</option></select></label><label class="fld">فاصله‌ی تکرار (دقیقه)<input id="fc" inputmode="numeric" value="${a.cool||60}"></label></div>`:""}
<label class="fld">یادداشت (اختیاری)<textarea id="fn" maxlength="120" placeholder="مثلاً حمایت هفتگی">${(a.note||"").replace(/</g,"&lt;")}</textarea></label>
<div class="err" id="fe"></div><div class="btns"><button class="p" id="fsave">ذخیره</button><button id="fcancel">انصراف</button></div>`;
bind();warn()}
function readForm(){const a=edit;a.sym=($("fs").value||"").trim().toUpperCase();a.note=($("fn").value||"").trim();
if(a.type==="time"){a.price=undefined;a.from=a.to=undefined}
else{a.from=$("ff")?$("ff").value||"":"";a.to=$("fto")?$("fto").value||"":"";
if(a.type==="every"){a.price=undefined;a.every=Math.round(+norm($("fev").value))||0}
else{a.price=parseFloat(norm($("fp").value));a.repeat=$("fr").value;a.cool=Math.max(1,Math.round(+norm($("fc").value)||60))}}}
function warn(){const w=$("warn");if(!w||edit.type!=="every")return;const n=+norm(($("fev")||{}).value)||edit.every,tmp={every:n,from:($("ff")||{}).value,to:($("fto")||{}).value},d=AL.perDay(tmp);
w.innerHTML=d>150?`⚠ با این تنظیم حدود <b>${fa(d)}</b> پیام در روز می‌آید. ممکنه سرویس رایگان ntfy.sh سقف روزانه‌ی پیام (حدود ۲۵۰) داشته باشه؛ بازه‌ی ساعتی کوتاه‌تر یا فاصله‌ی بیشتر انتخاب کن.`:`حدود ${fa(d)} پیام در روز`;w.style.color=d>150?"#ffb020":""}
function bind(){$("fcancel").onclick=closeForm;
$("ft").onclick=e=>{const b=e.target.closest("button");if(!b)return;readForm();edit.type=b.dataset.v;draw()};
$("fd").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=+b.dataset.d,i=edit.days.indexOf(v);i>=0?edit.days.splice(i,1):edit.days.push(v);b.classList.toggle("on")};
if(edit.type==="time"){$("fadd").onclick=()=>{const t=$("fnt").value;if(!t)return;if(!edit.at.includes(t))edit.at.push(t);edit.at.sort();readForm();draw()};$("fa").onclick=e=>{const b=e.target.closest("button[data-r]");if(b){edit.at=edit.at.filter(x=>x!==b.dataset.r);readForm();draw()}}}
else if(edit.type==="every"){$("fe2").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("fev").value=b.dataset.n;[...$("fe2").children].forEach(x=>x.classList.toggle("on",x===b));warn()};$("fev").oninput=()=>{const n=+norm($("fev").value);[...$("fe2").children].forEach(x=>x.classList.toggle("on",+x.dataset.n===n));warn()};["ff","fto"].forEach(i=>$(i).onchange=warn);$("fd").addEventListener("click",warn)}
else{const upd=async()=>{const s=($("fs").value||"").trim();if(s.length<2){$("cv").textContent="—";return}$("cv").textContent="…";const p=await getPrice(s);if(!$("cv"))return;if(p==null){$("cv").textContent="نامشخص";$("cq").innerHTML="";return}$("cv").textContent=AL.fmt(p);$("cq").innerHTML=[["−2%",.98],["−1%",.99],["+1%",1.01],["+2%",1.02]].map(([l,m])=>`<button type="button" data-m="${m}" data-p="${p}">${l}</button>`).join(" ")};
$("cgo").onclick=upd;$("cq").onclick=e=>{const b=e.target.closest("button[data-m]");if(b){const v=+b.dataset.p*+b.dataset.m;$("fp").value=String(+v.toPrecision(7))}};$("fs").onchange=upd}
$("fsave").onclick=()=>{readForm();const a=edit,err=AL.validate(a);if(err){$("fe").textContent=err;return}
if(a.from&&a.to&&a.from===a.to){a.from=a.to=""}delete a._new;const clean={id:a.id,sym:a.sym,type:a.type,on:a.on!==false};
if(a.type==="time")clean.at=a.at;else if(a.type==="every"){clean.every=a.every;if(a.from&&a.to){clean.from=a.from;clean.to=a.to}}else{clean.price=a.price;clean.repeat=a.repeat;if(a.repeat==="cool")clean.cool=a.cool;if(a.from&&a.to){clean.from=a.from;clean.to=a.to}}
if(a.days&&a.days.length&&a.days.length<7)clean.days=[...a.days].sort();if(a.note)clean.note=a.note;
const i=cfg.alerts.findIndex(x=>x.id===a.id);i>=0?cfg.alerts[i]=clean:cfg.alerts.push(clean);persist();closeForm();toast("هشدار ذخیره شد ✓")}}
$("add").onclick=()=>openForm(null);
/* ---- server sync ---- */
const slug=s=>/^[\w.-]+\/[\w.-]+$/.test(s);
function repoGuess(){const h=location.hostname,p=location.pathname.split("/").filter(Boolean);if(/\.github\.io$/.test(h)){const o=h.split(".")[0];return p.length&&!/\.[a-z]+$/i.test(p[0])?o+"/"+p[0]:o+"/"+h}return""}
const body=()=>JSON.stringify({tz:cfg.tz,alerts:cfg.alerts,updated:new Date().toISOString()},null,2)+"\n";
function syShow(h,c=""){const o=$("sy");o.className="sy "+c;o.innerHTML=h}
function manual(why){const t=body(),r=slug(($("ghr").value||"").trim())?$("ghr").value.trim():"OWNER/REPO";syShow((why?why+"<br>":"")+`این متن را در فایل <b dir="ltr">alerts.json</b> بگذار:<pre id="mj">${t.replace(/</g,"&lt;")}</pre><button id="mc" style="min-height:34px">کپی متن</button> <a href="https://github.com/${r}/new/main?filename=alerts.json&value=${encodeURIComponent(t)}" target="_blank" rel="noopener">ساخت فایل در GitHub</a><a href="https://github.com/${r}/edit/main/alerts.json" target="_blank" rel="noopener">ویرایش فایل موجود</a>`,why?"er":"");
$("mc").onclick=async()=>{try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(z){}x.remove()}$("mc").textContent="کپی شد ✓"}}
async function push(auto){const repo=($("ghr").value||"").trim(),tok=($("ght").value||"").trim();LS("bs_ghr",repo);LS("bs_ght",tok);cfg.tz=($("tz").value||"").trim()||devTz();LS("bs_altz",cfg.tz);
if(!tok||!slug(repo)){if(!auto)manual(tok?"آدرس ریپو درست نیست (مثل user/repo).":"");return}
$("push").disabled=true;syShow("در حال ذخیره روی GitHub…");
try{await ghPut("alerts.json",body(),repo,tok,"alerts: update");LS("bs_al_dirty","");syShow("✓ روی سرور ذخیره شد. از اجرای بعدی اسکن پس‌زمینه (حداکثر چند دقیقه) اعمال می‌شه.","ok");if(!auto)toast("روی سرور ذخیره شد ✓")}
catch(e){manual("⚠ ذخیره‌ی خودکار انجام نشد: "+(e&&e.message||"خطا"))}$("push").disabled=false}
function autoSync(){clearTimeout(timer);const repo=($("ghr").value||"").trim(),tok=($("ght").value||"").trim();if(tok&&slug(repo))timer=setTimeout(()=>push(true),900);else syShow(cfg.alerts.length?"تغییرات فقط روی همین گوشی ذخیره شد (اپ بازه چک می‌شه). برای اعلان وقتی اپ بسته است «ذخیره روی سرور» را بزن.":"")}
async function pull(){const repo=($("ghr").value||"").trim(),tok=($("ght").value||"").trim();let txt=null;
try{if(tok&&slug(repo)){const g=await ghGet("alerts.json",repo,tok);txt=g&&g.text}else{const r=await fetch("alerts.json?"+Date.now(),{cache:"no-store"});if(r.ok)txt=await r.text()}
if(!txt){toast("فایل alerts.json روی سرور نیست",true);return}const c=JSON.parse(txt);if(!Array.isArray(c.alerts))throw new Error("قالب فایل درست نیست");cfg.alerts=c.alerts;if(c.tz){cfg.tz=c.tz;$("tz").value=c.tz}persist();toast("از سرور دریافت شد ✓")}catch(e){toast("دریافت ناموفق: "+(e&&e.message||"خطا"),true)}}
$("push").onclick=()=>push(false);$("pull").onclick=pull;$("tz").onchange=persist;
/* ---- init ---- */
(async()=>{$("syms").innerHTML=U.map(u=>`<option value="${u[0]}">`).join("");load();$("ghr").value=LS("bs_ghr")||repoGuess();$("ght").value=LS("bs_ght")||"";$("tz").value=cfg.tz;
if(!cfg.alerts.length&&LS("bs_alerts")==null){try{const r=await fetch("alerts.json?"+Date.now(),{cache:"no-store"});if(r.ok){const c=await r.json();if(Array.isArray(c.alerts)&&c.alerts.length){cfg.alerts=c.alerts;if(c.tz)cfg.tz=c.tz;$("tz").value=cfg.tz;LS("bs_alerts",JSON.stringify({tz:cfg.tz,alerts:cfg.alerts}))}}}catch(e){}}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
</body></html>
